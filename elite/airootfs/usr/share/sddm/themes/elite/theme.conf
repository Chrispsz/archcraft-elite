# Archcraft ELITE · tema sddm `elite` — theme.conf (E106/5b)
# ─────────────────────────────────────────────────────────────────────
# A paleta da tela de login (docs/skills/02-paleta-oficial.md): fundo
# #111116 (a base obsidiana — nunca preto puro chapado), acento #a855f7
# (O ponto de ação — o botão Entrar e a borda em foco), textos #f4f4f6
# (elite-text). O Main.qml lê cada chave com default INTERNO idêntico
# (a escola do tema archcraft: o QML nunca quebra sem este conf). O fundo
# é RETÂNGULO PINTADO no próprio QML — zero PNG de papel no repo.

[General]

background_color="#111116"
# a base obsidiana da casa (nunca preto puro).

field_color="#18181f"
# a superfície elevada dos campos (Usuário/Senha — a ilha do cartão).

accent_color="#a855f7"
# elite-accent — o ponto de ação: botão Entrar e borda em foco.

text_color="#f4f4f6"
# elite-text — o corpo legível sobre a obsidiana.

border_color="#262637"
# a borda inativa (grafite da casa — o foco veste o acento).
