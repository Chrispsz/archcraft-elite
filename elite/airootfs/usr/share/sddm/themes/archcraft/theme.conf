# Archcraft ELITE · BLOCO 4 — a pele do GREETER (theme.conf override)
# ─────────────────────────────────────────────────────────────────────
# Este arquivo veste o tema `archcraft` do SDDM (archcraft-sddm-theme 2.0,
# o stack NATIVO da casa — sddm-git Qt6 + greeter X11) com A PALETA OFICIAL
# da Elite (docs/skills/02-paleta-oficial.md): Catppuccin Mocha + acento
# purple-500 — os MESMOS tokens do desktop, da barra, da dock e do LOCK
# (a skin v8 do hyprlock, irmã de verdade agora). O theme.conf upstream
# continua no pacote: ESTE arquivo só o sobrepõe (a ISO pega pelo overlay
# do airootfs; os rigs vivos recebem pelo elite-post-upgrade com o mestre
# do pacote em /usr/local/share/elite/sddm/).
#
# Regras da casa aplicadas:
#   · superfícies escuras ELEVADAS — #11111b/#181825, NUNCA preto puro
#     chapado (a ordem do dono);
#   · o acento é PONTO, não área: #a855f7/#cba6f7 só na borda em foco
#     (HighlightBorderColor — a "borda roxa ativa"), no botão de login e
#     na seleção; hover nunca inverte para claro;
#   · erro em #f38ba8 (elite-danger) — a voz ÚNICA do fracasso;
#   · blur leve (FullBlur 1.0/BlurMax 64 — o custo é do instante do
#     greeter; zero consumo residual durante a sessão ativa) + escureci-
#     mento sutil (DimBackground 0.3) sobre o fundo do tema;
#   · cantos no raio da casa: campos 20px (O RAIO DA DOCK, #dockbox no
#     theme.css), popups 12px (o raio dos popovers);
#   · ZERO saudação (HeaderText vazio — o ruído do "Welcome!" morre: uma
#     voz por tela, a mesma lei do lock v7);
#   · relógio/data no esquema que o dono aplaudiou ("HH:mm" +
#     "domingo, 9 de novembro", locale da sessão);
#   · sessão labwc direta (kde_settings.conf Session=labwc + state.conf
#     pré-selecionam — sem ruído visual de seletor);
#   · fonte Iosevka (kde_settings.conf Font=Iosevka — a mesma do lock).
#
# Estrutura fiel ao theme.conf upstream 2.0 (todas as chaves presentes —
# o QML do tema lê com default interno; nada fica órfão).

[General]

#################### General ####################

ScreenWidth=""
ScreenHeight=""
ScreenPadding=""

Font="Iosevka"
FontSize=""
# Default is screen height divided by 80 (1080/80=13.5), Options: 0-inf.

KeyboardSize="0.5"

RoundCorners="20"
# O RAIO DA DOCK (#dockbox no theme.css) — os campos vestem o mesmo raio
# das ilhas da casa (a era pílula-100 do upstream se aposenta).

PopupRadius="12"
# O raio dos popovers da casa (theme.css popover > contents).

Locale=""
# Locale for data and time format. I suggest leaving it blank.

HourFormat="HH:mm"

DateFormat="dddd, MMMM d"
# "domingo, 9 de novembro" — o esquema que o dono aplaudiu.

HeaderText=""
# ZERO saudação (a ordem do dono — uma voz por tela; o "Welcome!" morre).

#################### Background ####################

BackgroundPlaceholder=""

Background="Backgrounds/bg-1.png"
# O fundo do tema (a ISO da casa) — o lock adapta com o wallpaper do
# desktop; o greeter não tem usuário ainda, o fundo fixo do tema é honesto.

BackgroundSpeed=""

PauseBackground=""

DimBackground="0.3"
# O escurecimento SUTIL (a superfície escura elevada — o texto nítido
# precisa da base estável; nunca preto chapado).

CropBackground="true"

BackgroundHorizontalAlignment="center"

BackgroundVerticalAlignment="center"

#################### Colors ####################

HeaderTextColor="#f8fafc"
# elite-text-bright — o nítido dos títulos (cabeçalho vazio, o token fica
# para o contrato completo das cores).

DateTextColor="#cdd6f4"
# elite-text — o corpo da casa.

TimeTextColor="#f8fafc"
# elite-text-bright — O RELÓGIO é o texto mais nítido da tela (a mesma
# lei do relógio da barra: #f8fafc, peso bold).

FormBackgroundColor="#181825"
# elite-bg-dock — a ilha (usada só se HaveFormBackground=true).

BackgroundColor="#11111b"
# elite-base — a superfície elevada (nunca preto puro).

DimBackgroundColor="#11111b"

LoginFieldBackgroundColor="transparent"
PasswordFieldBackgroundColor="transparent"

LoginFieldTextColor="#cdd6f4"
PasswordFieldTextColor="#cdd6f4"
# elite-text — o que o dono digita lê AAA (12.97:1 sobre a base).

UserIconColor="#cba6f7"
PasswordIconColor="#cba6f7"
# elite-accent-strong — os ícones são PONTO de acento, não área.

LoginFieldBorderColor="#262637"
PasswordFieldBorderColor="#262637"
# elite-border — a borda INATIVA (grafite da casa).

InputFieldBorderWidth="2"
InputFieldFocusBorderWidth="2"
# A espessura do foco é a mesma do outline do guia 03 (2px).

WarningColor="#f38ba8"
# elite-danger — a voz ÚNICA do erro (login falhou/capslock).

LoginButtonTextColor="#11111b"
# texto escuro SOBRE o acento (4.74:1 AA — o par medido da paleta).

LoginButtonHoverTextColor="#11111b"
LoginButtonBackgroundColor="#a855f7"
# elite-accent — o botão de login é O ponto de ação.

SystemButtonsIconsColor="#cdd6f4"
SessionButtonTextColor="#cdd6f4"
VirtualKeyboardButtonTextColor="#cdd6f4"

DropdownTextColor="#cdd6f4"
DropdownSelectedTextColor="#11111b"
DropdownSelectedBackgroundColor="#a855f7"
DropdownBackgroundColor="#181825"

HighlightTextColor="#11111b"
HighlightBackgroundColor="#a855f7"
HighlightBorderColor="#a855f7"
# A BORDA ROXA ATIVA: HighlightBorderColor é a borda do campo EM FOCO
# (verificado no Components/Input.qml do tema — activeFocus ? Highlight
# BorderColor : *FieldBorderColor). O foco veste o acento calibrado.

HoverUserIconColor="#cba6f7"
HoverPasswordIconColor="#cba6f7"
HoverSystemButtonsIconsColor="#cba6f7"
HoverSessionButtonTextColor="#cba6f7"
HoverVirtualKeyboardButtonTextColor="#cba6f7"
# O hover NUNCA inverte para claro (lei 4 da paleta): sobe o acento
# suave (#cba6f7 — o secondary da casa).

#################### Form ####################

PartialBlur="false"

FullBlur="true"
# O BLUR LEVE da casa: o fundo borrado por INTEIRO (o custo é do
# instante do greeter — zero consumo residual na sessão ativa).

BlurMax="64"
# O teto recomendado pelo upstream para FullBlur (leve e barato).

Blur="1.0"
# Blur leve: o wallpaper do tema legível atrás do cartão.

HaveFormBackground="false"
# Sem cartão atrás dos campos (a era do card crust 470×120 segue
# aposentada — o lock v7+ não tem; o greeter é irmã).

FormPosition="center"

#################### Virtual Keyboard ####################

VirtualKeyboardPosition="center"

#################### Interface Behavior ####################

HideVirtualKeyboard="false"
HideSystemButtons="false"
HideLoginButton="false"

UseRealName="true"
# O nome real (GECOS) na tela — o contrato da era v5 mantido.

ForceLastUser="true"

PasswordFocus="true"

HideCompletePassword="true"

AllowEmptyPassword="false"

BypassSystemButtonsChecks="false"

RightToLeftLayout="false"

#################### Translation ####################

TranslatePlaceholderUsername=""
TranslatePlaceholderPassword=""
TranslateLogin=""
TranslateLoginFailedWarning=""
TranslateCapslockWarning=""
TranslateSuspend=""
TranslateHibernate=""
TranslateReboot=""
TranslateShutdown=""
TranslateSessionSelection=""
TranslateVirtualKeyboardButtonOn=""
TranslateVirtualKeyboardButtonOff=""
