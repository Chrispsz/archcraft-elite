# ══ ELITE · MangoHud perfil DIAGNÓSTICO COMPLETO (E136) ══════════════════
# A telemetria inteira para a perícia: carga POR NÚCLEO de CPU, o par
# de I/O (leitura/escrita), swap, engine, resolução e o consumo de toda
# a cadeia. É o perfil do "por que o jogo engasga" — troca: elite-mangohud.
fps
fps_metrics=avg,0.01,0.001
frametime
frame_timing
engine_version
gpu_name
resolution
cpu_stats
cpu_temp
cpu_power
cpu_mhz
cpu_core_load
gpu_stats
gpu_temp
gpu_core_clock
gpu_power
ram
vram
swap
io_read
io_write
wine
position=top-left
font_size=22
background_alpha=0.35
table_columns=4
