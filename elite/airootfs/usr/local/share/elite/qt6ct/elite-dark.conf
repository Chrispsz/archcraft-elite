# O RELATO DO RIG 1.0-107.3: o journal carregava "Fallback Icon Theme
# (Oxygen) not found" e o diálogo do polkit nascia BRANCO no meio do
# rice escuro. A diretriz: tema escuro Qt (QT_QPA_PLATFORMTHEME=qt6ct +
# esquema válido + tema de ícones válido).
#
# O FORMATO é o do próprio qt6ct (src/qt6ct-common/qt6ct.cpp —
# loadColorScheme: listas active/inactive/disabled com NColorRoles
# entradas na ORDEM DO ENUM: WindowText, Button, Light, Midlight, Dark,
# Mid, Text, BrightText, ButtonText, Base, Window, Shadow, Highlight,
# HighlightedText, Link, LinkVisited, AlternateBase, NoRole,
# ToolTipBase, ToolTipText, PlaceholderText, Accent) — a paleta
# Catppuccin-Mocha da casa (o MESMO rice dos settings.ini GTK).
# ═════════════════════════════════════════════════════════════════════════
