# Archcraft ELITE · GTK4 settings — espelho do GTK3 (Desktop v2 RICE · v1.0.4)
# 1.0-109 — o tema de ícones é o que a MÁQUINA garante (o Adwaita da base — o Fallback Oxygen do journal morre).
[Settings]
gtk-theme-name=Catppuccin-Mocha-Standard-Mauve-Dark
gtk-icon-theme-name=Adwaita
gtk-cursor-theme-name=Bibata
gtk-cursor-theme-size=24
gtk-application-prefer-dark-theme=true
# E151 — A LEI DA MOLDURA: os botões de janela nascem À DIREITA (a
# mesma lei do rc.xml do labwc — layout icon:iconify,max,close). O
# dois-pontos ANTES da lista = sem botões à esquerda; tema que não
# respeita a linha é corrigido pelo craft-rice (o mestre no pacote).
gtk-decoration-layout=:minimize,maximize,close
# entregue por craft-rice (o marcador da casa autoriza a renovação pela gramática E91/E130)
