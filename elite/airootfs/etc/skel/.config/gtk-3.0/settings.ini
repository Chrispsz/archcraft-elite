# Archcraft ELITE · GTK3 settings — Desktop v2 RICE (v1.0.4)
# Tema GTK Catppuccin Mocha oficial (variante Standard-Mauve-Dark = o acento
# do rice labwc/waybar/swaync) e cursor Bibata. Escuro por padrão — coeso
# com o rice inteiro.
# E126 → 1.0-109 — O TEMA DE ÍCONES É O QUE A MÁQUINA GARANTE (a
# evidência do dump 1.0-108: o lxqt-policykit-agent reclamando
# 'Fallback Icon Theme (Oxygen) not found' — o Papirus de era não é
# garantido no disco de TODO rig e o Oxygen do fallback nunca existiu).
# A mesma escola do cursor do greeter (99-elite.conf): o Adwaita
# (adwaita-icon-theme viaja na base do Arch) é o tema que a MÁQUINA
# garante — o ícone pedido SEMPRE resolve, o fallback Oxygen morre com
# o tema que nunca falta. Quem escolhe outro tema no nwg-look segue com
# a escolha dele — a casa só define o default, nunca trava.
[Settings]
gtk-theme-name=Catppuccin-Mocha-Standard-Mauve-Dark
gtk-icon-theme-name=Adwaita
gtk-cursor-theme-name=Bibata
gtk-cursor-theme-size=24
gtk-application-prefer-dark-theme=true
# E151 — A LEI DA MOLDURA: os botões de janela nascem À DIREITA (a
# mesma lei do rc.xml do labwc — layout icon:iconify,max,close). O
# dois-pontos ANTES da lista = sem botões à esquerda; tema que não
# respeita a linha é corrigido pelo craft-rice (o mestre no pacote).
gtk-decoration-layout=:minimize,maximize,close
# entregue por craft-rice (o marcador da casa autoriza a renovação pela gramática E91/E130)
