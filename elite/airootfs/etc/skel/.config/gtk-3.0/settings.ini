# Archcraft ELITE · GTK3 settings — Desktop v2 RICE (v1.0.4)
# Tema GTK Catppuccin Mocha oficial (variante Standard-Mauve-Dark = o acento
# do rice labwc/waybar/swaync) e cursor Bibata. Escuro por padrão — coeso
# com o rice inteiro.
# E126 — O TEMA DE ÍCONES VOLTOU (a ordem do dono: "padronizar o tema de
# ícones do sistema para eliminar inconsistências visuais"). A v2.2 tinha
# removido a linha por leveza — o preço foi a BABEL: cada app no próprio
# hicolor, o fallback Adwaita no resto, e o visual da dock/gaveta/GTK
# sem família nenhuma. O Papirus-Dark é o padrão da casa AGORA: UM tema
# escuro coerente com o Mocha (a adoção via craft-update o instala nos
# rigs vivos; quem escolhe outro tema no nwg-look segue com a escolha
# dele — a casa só define o default, nunca trava).
[Settings]
gtk-theme-name=Catppuccin-Mocha-Standard-Mauve-Dark
gtk-icon-theme-name=Papirus-Dark
gtk-cursor-theme-name=Bibata
gtk-cursor-theme-size=24
gtk-application-prefer-dark-theme=true
# entregue por craft-rice (o marcador da casa autoriza a renovação pela gramática E91/E130)
