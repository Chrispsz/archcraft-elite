# Archcraft ELITE · GTK3 settings — Desktop v2 RICE (v1.0.4)
# Tema GTK Catppuccin Mocha oficial (variante Standard-Mauve-Dark = o acento
# do rice labwc/waybar/swaync) e cursor Bibata. Escuro por padrão — coeso
# com o rice inteiro.
# v2.2 (leveza radical): SEM linha de tema de ícones — cada app usa o
# próprio (hicolor) e o GTK cai no fallback base Adwaita (dep dura de
# gtk3/gtk4 — ~1 MB, já na ISO como dependência, não como tema escolhido).
[Settings]
gtk-theme-name=Catppuccin-Mocha-Standard-Mauve-Dark
gtk-cursor-theme-name=Bibata
gtk-cursor-theme-size=24
gtk-application-prefer-dark-theme=true
