# ── ELITE · qt6ct — o tema Qt veste o rice (E129 → 1.0-108) ────────────────
# A ordem do dono: "padronizar o tema de ícones" — o Qt6 (LACT? não; o
# Qt que sobrar: ferramentas de terceiros) lia o tema DEFAULT (nu, claro)
# no meio do rice AMOLED. O Papirus-Dark é o MESMO dos settings.ini GTK
# (gtk-icon-theme-name) — GTK e Qt na mesma família de ícones, zero babel.
# 1.0-108 — O ESCURO DE VERDADE (o relato do rig 1.0-107.3: o journal
# com "Fallback Icon Theme (Oxygen) not found" e o diálogo do polkit
# BRANCO na mesa escura): o QT_QPA_PLATFORMTHEME=qt6ct do environment
# liga ESTE conf, o Fusion veste o ESQUEMA da casa (custom_palette +
# color_scheme_path no elite-dark.conf — a paleta Catppuccin-Mocha,
# o MESMO rice dos GTK) e o ícone cai no Papirus-Dark válido (o
# fallback Oxygen que o journal nomeava não existe no disco — agora
# nem é procurado). Idempotente pela lei do post-upgrade: o qt6ct.conf
# da casa nasce SE AUSENTE no home — personalização do dono é
# intocável (o esquema mora em /usr/local/share: espaço de sistema).
[Appearance]
style=Fusion
icon_theme=Papirus-Dark
custom_palette=true
color_scheme_path=/usr/local/share/elite/qt6ct/elite-dark.conf
# entregue por craft-rice (o marcador da casa autoriza a renovação pela gramática E101/E130)
