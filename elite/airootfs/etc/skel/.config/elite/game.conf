# Archcraft ELITE · modo de jogo (~/.config/elite/game.conf)
# ─────────────────────────────────────────────────────────────────────────
# A CHAVE DA VAGA AUTOMÁTICA (E138): AUTO=1 = o elite-daemon session
# mantém o motor do modo jogo DE PÉ (o E132: detecção /proc com as três
# portas, GameMode por D-Bus, EPP dinâmico e debounce de 3s — um processo
# nativo, o comm veste elite-daemon-game). AUTO=0 = ausência intencional
# (lei do idle E36) — o toggle do menu escreve AQUI na hora, sem relogin.
#
# Restrito: nenhuma outra chave é lida daqui — a família de jogos é do
# comm E106 (o kernel corta o comm em 15 chars, o padrão casa o corte),
# o scheduling de fundo é do CachyOS-Settings (nenhuma camada luta com
# outra; o gamemode entra POR CIMA só no jogo).
AUTO=1
