# Archcraft ELITE · tempo de idle (~/.config/elite/idle.conf · v1.6.1)
# ─────────────────────────────────────────────────────────────────────────
# Ajustável pelo menu do desktop → "Trava automática…" (craft-idle)
# — a mudança vale na hora, sem relogin. Ou edite aqui.
#
# E150 — A FÁBRICA NOVA (a ordem do dono, base 1.0-98): TRAVA E APAGAR
# são tempos PRÓPRIOS agora — o desktop trava em LOCK_MIN e a tela
# APAGA em OFF_MIN (fábrica 5/10: a mesa trava aos 5 minutos e escurece
# aos 10 — o dono VÊ o lock vivo e a tela não fica acesa à toa). Acorda
# → já está no lock. O OFF_MIN MENOR/igual ao LOCK volta ao gesto único
# E43 (trava E apaga no MESMO instante — a escolha de quem prefere).
# Suspend é o degrau seguinte, contado da inatividade (o before-sleep
# re-trava antes de dormir).
#
# LOCK_MIN : minutos de inatividade até TRAVAR (hyprlock). 0 = nunca
#            sozinho (W-l manual)
# OFF_MIN  : minutos de inatividade até APAGAR a tela (wlopm --off) —
#            E150: tempo PRÓPRIO (fábrica 10; igual/menor que o LOCK
#            colapsa no gesto único E43)
# SUSPEND_MIN (v2.3.5): minutos de inatividade até SUSPENDER de verdade
#            (systemctl suspend -i). 0 = OFF. Fábrica: 20 min — 5 min em
#            um desktop interrompe trabalho vivo (download/update morre
#            no meio). O before-sleep trava a tela ANTES de suspender —
#            acorda no lock, sempre (e o wake-guard E24 mantém o sono
#            fundo).
# E60 — A VIGÍLIA: o lock ARMA o próprio vigia (craft-vigil). O suspend
#            deixou de depender SÓ do relógio de idle: quem dorme o PC
#            também é o tempo TRAVADO — hyprlock vivo há SUSPEND_MIN
#            minutos = systemctl suspend. Manual (W-l), menu e idle:
#            TODOS os locks dormem travado. 0 = off (escolha explícita).
LOCK_MIN=5
OFF_MIN=10
SUSPEND_MIN=20
