# Archcraft ELITE · tempo de idle (~/.config/elite/idle.conf · v1.6.1)
# ─────────────────────────────────────────────────────────────────────────
# Ajustável pelo menu do desktop → "Tempo para travar a tela…" (craft-idle)
# — a mudança vale na hora, sem relogin. Ou edite aqui e rode: craft-idle
# start (reinicia o daemon com estes valores).
#
# LOCK_MIN : minutos de inatividade até a tela TRAVAR (hyprlock — o lock
#            com relógio/avatar/senha). 0 = nunca travar sozinho (W-l manual)
# OFF_MIN  : minutos até a TELA APAGAR de verdade (DPMS/wlopm). A tela
#            acorda no primeiro input JÁ MOSTRANDO o lock — é o fluxo
#            "idle" padrão: PC descansando = tela apagada, não tela fixa.
#            Mantenha ≥ LOCK_MIN (o padrão soma +5).
# SUSPEND_MIN (v2.3.5): minutos até SUSPENDER de verdade (systemctl
#            suspend) — o padrão das outras distros quando o PC fica
#            idle. 0 = OFF.
#            v2.10.8 — o default de fábrica era 0 (a ISO não mudava
#            comportamento às escondidas) e o PC NUNCA dormia: o dump
#            d33o provou o kernel capaz ('freeze mem disk', mem_sleep
#            [deep]) e o conf ditando 'nunca'. Fábrica agora suspende
#            aos 20 min (lock 10 → tela apaga 15 → dorme 20 — o fluxo
#            "idle" completo das outras distros). Quem não quer,
#            escreve 0 aqui e roda: craft-idle start.
#            O before-sleep trava a tela ANTES de suspender — acorda no
#            lock, sempre.
LOCK_MIN=10
OFF_MIN=15
SUSPEND_MIN=20
