# Archcraft ELITE · tempo de idle (~/.config/elite/idle.conf · v1.6.1)
# ─────────────────────────────────────────────────────────────────────────
# Ajustável pelo menu do desktop → "Tempo para travar a tela…" (craft-idle)
# — a mudança vale na hora, sem relogin. Ou edite aqui e rode: craft-idle
# start (reinicia o daemon com estes valores).
#
# E43 — O FLUXO QUE FAZ SENTIDO (o dono: "as montagens do bloquear e do
# suspender fazendo mais sentido… ainda não sinto que seja o melhor fluxo"):
# o padrão antigo (lock 2 → tela apaga 7) deixava 5 MINUTOS de tela
# TRAVADA E ACESA — ninguém quer um lock screen brilhando na sala. O fluxo
# da casa agora é UM SÓ GESTO: no mesmo instante, o idle TRAVA e APAGA
# (LOCK_MIN = OFF_MIN). Acorda → já está no lock. Dorme → escuro de fato.
# Suspend é o degrau seguinte, independente (o before-sleep re-trava).
#
# LOCK_MIN : minutos de inatividade até TRAVAR E APAGAR (hyprlock + wlopm
#            --off no mesmo tick do swayidle). 0 = nunca sozinho (W-l manual)
# OFF_MIN  : mantenha IGUAL ao LOCK_MIN (um só gesto). Um valor MAIOR deixa
#            a tela travada acesa no meio-caminho (o defeito que a E43 mata)
# SUSPEND_MIN (v2.3.5): minutos até SUSPENDER de verdade (systemctl
#            suspend -i). 0 = OFF. Fábrica: 20 min — 5 min em um desktop
#            interrompe trabalho vivo (download/update morre no meio); quem
#            quer 5, o menu tem "Suspender: 5 min" — um clique, sem editar
#            nada. O before-sleep trava a tela ANTES de suspender — acorda
#            no lock, sempre (e o wake-guard E24 mantém o sono fundo).
LOCK_MIN=5
OFF_MIN=5
SUSPEND_MIN=20
