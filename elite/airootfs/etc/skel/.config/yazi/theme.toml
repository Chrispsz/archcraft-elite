# ── ELITE v1.1 · yazi theme — Catppuccin Mocha (accent Mauve #cba6f7) ───
[manager]
cwd = { fg = "#cba6f7" }

hovered         = { fg = "#1e1e2e", bg = "#cba6f7" }
preview_hovered = { underline = true }

find_keyword  = { fg = "#f9e2af", bold = true, italic = true, underline = true }
find_position = { fg = "#f5c2e7", bg = "#11111b", italic = true }

marker_selected = { fg = "#a6e3a1", bg = "#11111b" }
marker_copied   = { fg = "#f9e2af", bg = "#11111b" }
marker_cut      = { fg = "#f38ba8", bg = "#11111b" }

tab_active   = { fg = "#1e1e2e", bg = "#cba6f7" }
tab_inactive = { fg = "#cdd6f4", bg = "#313244" }
tab_width    = 1

count_copied   = { fg = "#94e2d5", bold = true }
count_cut      = { fg = "#f38ba8", bold = true }
count_selected = { fg = "#a6e3a1", bold = true }

border_symbol = "│"
border_style  = { fg = "#7f849c" }

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#313244", bg = "#313244" }

mode_normal = { fg = "#1e1e2e", bg = "#cba6f7", bold = true }
mode_select = { fg = "#1e1e2e", bg = "#a6e3a1", bold = true }
mode_unset  = { fg = "#1e1e2e", bg = "#f9e2af", bold = true }

progress_label  = { fg = "#cdd6f4", bold = true }
progress_normal = { fg = "#89b4fa", bg = "#11111b" }
progress_error  = { fg = "#f38ba8", bg = "#11111b" }

permissions_t = { fg = "#a6e3a1" }
permissions_r = { fg = "#f9e2af" }
permissions_w = { fg = "#f38ba8" }
permissions_x = { fg = "#94e2d5" }
permissions_s = { fg = "#7f849c" }
permissions_- = { fg = "#6c7086" }

[input]
border   = { fg = "#cba6f7" }
title    = {}
value    = {}
selected = { reversed = true }

[select]
border   = { fg = "#89b4fa" }
active   = { fg = "#f5c2e7" }
inactive = {}

[tasks]
border  = { fg = "#89b4fa" }
title   = {}
hovered = { underline = true }

[which]
mask            = { bg = "#313244" }
cand            = { fg = "#94e2d5" }
rest            = { fg = "#9399b2" }
desc            = { fg = "#f5c2e7" }
separator       = "  "
separator_style = { fg = "#585b70" }

[help]
on      = { fg = "#94e2d5" }
run     = { fg = "#cba6f7" }
desc    = { fg = "#9399b2" }
hovered = { bg = "#313244", bold = true }
footer  = { fg = "#11111b", bg = "#cdd6f4" }

[filetype]
rules = [
    { mime = "image/*", fg = "#94e2d5" },
    { mime = "video/*", fg = "#f5c2e7" },
    { mime = "audio/*", fg = "#f9e2af" },
    { mime = "archive/*", fg = "#f38ba8" },
    { mime = "application/zip", fg = "#f38ba8" },
    { name = "*/", fg = "#cba6f7", bold = true },
    { name = "*", fg = "#cdd6f4" },
]
