# ── ELITE: MangoHud (E136 — a PARTE 2/2 do dono: os 3 perfis zero-config) ──
# Este arquivo é o GAMING BALANCEADO — o default da casa (FPS, frametime,
# o pulso de CPU/GPU com uso/clock/temp/watts, RAM/VRAM e o Wine/Proton).
# Os TRÊS perfis moram em /usr/local/share/elite/mangohud/ (minimalista,
# balanceado, diagnostico) e a troca é UM gesto, SEM editar .conf na mão:
#
#     elite-mangohud              (menu: escolhe o perfil da vez)
#     elite-mangohud minimal      (só FPS + frametime + temperaturas)
#     elite-mangohud balanceado   (este aqui — o painel do dia a dia)
#     elite-mangohud diagnostico  (telemetria por núcleo p/ perícia)
#
# Config PERSONALIZADA do dono é intocável (a gramática da casa): o
# elite-mangohud só substitui o que ELE mesmo gerenciou (o marcador
# conta a história; arquivo sem marcador recebe backup .bak antes de
# qualquer troca).
fps
frametime
frame_timing
cpu_stats
cpu_temp
cpu_power
cpu_mhz
gpu_stats
gpu_temp
gpu_core_clock
gpu_power
ram
vram
wine
position=top-left
font_size=22
background_alpha=0.35
