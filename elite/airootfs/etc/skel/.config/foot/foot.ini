# Archcraft ELITE · foot — o terminal do rice AMOLED (v1.5 · CORRIGIDO)
# foot.ini(5) — schema do foot 1.26+ (o Arch/extra rola em 1.28): as seções
# [shell]/[font]/[colors]/[dim]/[bright-bold] da v1.3 NÃO EXISTIAM no foot —
# o terminal logava "invalid section name" e IGNORAVA tudo dentro delas:
# a fonte Nerd, o shell de login e as 16 cores Catppuccin nunca chegaram a
# valer. Schema válido (codeberg.org/dnkl/foot · doc/foot.ini.5.scd):
#   [main]         ← shell= e font= (fontconfig "family:size")
#   [colors-dark]  ← TODA a cor (a [colors] saiu no 1.28; dim0-7 vivem AQUI;
#                    cursor= saiu de [cursor] e virou chave daqui)
#   [key-bindings] ← defaults duplicados removidos (clipboard-paste/copy
#                    já são Control+Shift+v/c de fábrica)
# 16 tons Catppuccin Mocha com background AMOLED #000000; cursor e seleção
# em MAUVE. Fonte: a REAL do archcraft-fonts 2.0 (JetBrainsMono NF — a
# mesma família da waybar/fuzzel).

[main]
# v2.10.5 — O SHELL É O ZSH (a auditoria de simulações provou o corte:
# '/bin/sh -l' abria bash-POSIX SEM o .zshrc — starship, autosuggestion,
# aliases eza/bat/dust/procs: TUDO morto no terminal principal da distro,
# silenciosamente). O zsh é o shell do usuário (packages.add + plugins +
# .zshrc 'dono do shell'); o -l mantém o login shell das variáveis.
shell = /usr/bin/zsh -l
font = JetBrainsMono NF:size=10.5

[scrollback]
lines = 10000
multiplier = 3

[bell]
urgent = yes
notify = yes

[cursor]
style = block
blink = yes

[mouse]
hide-when-typing = yes

[colors-dark]
foreground = cdd6f4
background = 000000
selection-foreground = 000000
selection-background = cba6f7
urls = 89b4fa
# v1.5: a cor do cursor vive AQUI (foot 1.26 removeu cursor.color da
# seção [cursor]): texto invertido — bloco mauve com glifo preto AMOLED
cursor = 000000 cba6f7

# regular (Mocha — background amarrado ao preto AMOLED)
regular0   = 45475a
regular1   = f38ba8
regular2   = a6e3a1
regular3   = f9e2af
regular4   = 89b4fa
regular5   = f5c2e7
regular6   = 94e2d5
regular7   = bac2de

bright0    = 585b70
bright1    = f38ba8
bright2    = a6e3a1
bright3    = f9e2af
bright4    = 89b4fa
bright5    = f5c2e7
bright6    = 94e2d5
bright7    = a6adc8

# dim (v1.5: as chaves dim0-7 moram DENTRO da seção de cores — a seção
# [dim] separada da v1.3 era inválida e nunca foi aplicada)
dim0 = a6adc8
dim1 = eba0ac
dim2 = 94e2d5
dim3 = f5e0dc
dim4 = 74c7ec
dim5 = f2cdcd
dim6 = 89dceb
dim7 = cdd6f4

# v1.5: o bloco bare "0=..15=" da v1.3 foi REMOVIDO — ele escrevia os
# MESMOS slots da paleta (regular/bright) com valores de OUTRA tabela
# (0=f5e0dc: o "preto" renderizava rosado). A forma canônica das 16
# cores ANSI é regular0-7 + bright0-7 acima.

[key-bindings]
# v1.5: clipboard-paste/copy/show-urls-launch removidos — eram defaults
# do foot duplicados (Control+Shift+v/c). Os dois de scroll NÃO são
# defaults (de fábrica exigem Shift): Page_Up/Page_Down soltos são a UX
# da Elite desde a v1.3 — mantidos de propósito.
scrollback-up-page = Page_Up
scrollback-down-page = Page_Down
