# Archcraft ELITE · foot — o terminal do rice AMOLED (v1.3 · NOVO)
# foot.ini(5). O foot NUNCA teve config na ISO (defaults embutidos) —
# a partir da v1.3 o terminal é superfície do rice: preto AMOLED,
# 16 tons Catppuccin Mocha (fundo trocado por #000000), cursor e
# seleção em MAUVE. Fonte: a REAL do archcraft-fonts 2.0.

[shell]
command = /bin/sh -l

[font]
family = JetBrainsMono NF
size = 10.5

[scrollback]
lines = 10000
multiplier = 3

[bell]
urgent = yes
notify = yes

[cursor]
style = block
blink = yes
color = 000000 cba6f7

[mouse]
hide-when-typing = yes

[colors]
foreground = cdd6f4
background = 000000
selection-foreground = 000000
selection-background = cba6f7
urls = 89b4fa

# regular (Mocha — background amarrado ao preto AMOLED)
regular0   = 45475a
regular1   = f38ba8
regular2   = a6e3a1
regular3   = f9e2af
regular4   = 89b4fa
regular5   = f5c2e7
regular6   = 94e2d5
regular7   = bac2de

bright0    = 585b70
bright1    = f38ba8
bright2    = a6e3a1
bright3    = f9e2af
bright4    = 89b4fa
bright5    = f5c2e7
bright6    = 94e2d5
bright7    = a6adc8

# 16-256: tabelas Catppuccin Mocha oficiais (github.com/catppuccin/foot)
0 = f5e0dc
1 = f38ba8
2 = a6e3a1
3 = f9e2af
4 = 89b4fa
5 = f5c2e7
6 = 94e2d5
7 = bac2de
8 = 585b70
9 = f38ba8
10 = a6e3a1
11 = f9e2af
12 = 89b4fa
13 = f5c2e7
14 = 94e2d5
15 = a6adc8

[dim]
0 = a6adc8
1 = eba0ac
2 = 94e2d5
3 = f5e0dc
4 = 74c7ec
5 = f2cdcd
6 = 89dceb
7 = cdd6f4

[bright-bold]
0 = a6adc8
1 = eba0ac
2 = 94e2d5
3 = f5e0dc
4 = 74c7ec
5 = f2cdcd
6 = 89dceb
7 = cdd6f4

[key-bindings]
scrollback-up-page = Page_Up
scrollback-down-page = Page_Down
clipboard-paste = Control+Shift+v
clipboard-copy = Control+Shift+c
show-urls-launch = Control+Shift+u

[tweak]
# max-shader-prompt: o véu de seleção não custa um shader em placa AMD/NVIDIA
max-shader-prompt = yes
