# Archcraft ELITE · hyprlock — a tela de lock do rice (v1.5 · NOVO)
# ─────────────────────────────────────────────────────────────────────
# Substitui o swaylock (que travava numa tela branca estática — o fix
# visual mais pedido do burn test). hyprlock roda no labwc pelo protocolo
# ext-session-lock-v1 (labwc o implementa nativamente — labwc.github.io/
# integration; casos documentados: hyprlock #607/#211, labwc #3672).
#
# DESIGN (especificação do dono, v1.5):
#   · fundo = SCREENSHOT da tela atual + blur alto + dim (brightness .35)
#   · relógio GRANDE no topo-centro + data
#   · avatar + nome do usuário acima do campo
#   · campo de senha com borda mauve estilizada, placeholder "Digite a
#     senha para desbloquear", SEMPRE visível (fade_on_empty = false)
#   · feedback: asteriscos (dots_text_format = *), "Validando…" âmbar
#     durante o PAM, "Senha Incorreta" em vermelho na falha
#
# Acionado por: swayidle (10 min → lock · 15 min → DPMS wlopm · before-
# sleep), craft-lock (atalho/labwc menu) e craft-logout.
# Personalizar o avatar: troque /usr/share/pixmaps/elite/avatar.png por
# ~/.face.icon no bloco image abaixo (SDDM/lifecycle usam .face.icon).
# Sintaxe: wiki.hyprland.org/Hypr-Ecosystem/hyprlock (example.conf).

$font = JetBrainsMono NF

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# ── Fundo: o desktop CONGELADO ────────────────────────────────────────
# path=screenshot captura a tela via wlr-screencopy (labwc nativo);
# blur alto + brightness .35 = o "dim" da spec; noise sutil mata o
# banding do blur em painel escuro; contrast .89 assenta o véu.
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.350000
    noise = 0.011000
    contrast = 0.890000
}

# ── Relógio GRANDE no topo-centro ─────────────────────────────────────
label {
    monitor =
    text = $TIME
    color = rgba(205, 214, 244, 1.0)            # text
    font_size = 96
    font_family = $font

    position = 0, 48
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:30000] date +"%A · %d %B %Y"
    color = rgba(108, 112, 134, 1.0)            # overlay1
    font_size = 22
    font_family = $font

    position = 0, 152
    halign = center
    valign = top
}

# ── Avatar + nome (acima do campo de senha) ───────────────────────────
# rounding = -1 → círculo perfeito; borda 4px mauve (a identidade do
# rice). Path ABSOLUTO deterministic — sem expansão de ~ no parser.
image {
    monitor =
    path = /usr/share/pixmaps/elite/avatar.png
    size = 128
    rounding = -1
    border_size = 4
    border_color = rgba(203, 166, 247, 0.95)    # mauve
    position = 0, -170
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(205, 214, 244, 0.92)           # text
    font_size = 26
    font_family = $font

    position = 0, -72
    halign = center
    valign = center
}

# ── Campo de senha ────────────────────────────────────────────────────
input-field {
    monitor =
    size = 380, 52
    outline_thickness = 3
    rounding = 14

    # caixa: preto AMOLED translúcido (o blur do fundo atravessa)
    inner_color = rgba(17, 17, 27, 0.72)        # crust
    outer_color = rgba(203, 166, 247, 1.0)      # mauve — a borda estilizada
    check_color = rgba(249, 226, 175, 0.85)     # yellow — validando
    fail_color = rgba(243, 139, 168, 0.95)      # red — senha incorreta
    font_color = rgba(205, 214, 244, 1.0)       # text

    font_family = $font
    fade_on_empty = false
    placeholder_text = <span foreground="rgb(203,166,247)" style="italic">Digite a senha para desbloquear</span>
    fail_text = <span foreground="rgb(243,139,168)">Senha Incorreta</span>
    check_text = <span foreground="rgb(249,226,175)">Validando…</span>

    # asteriscos no lugar dos dots (spec: feedback de digitação)
    dots_text_format = *
    dots_size = 0.38
    dots_spacing = 0.3
    hide_input = false

    position = 0, 36
    halign = center
    valign = center
}
