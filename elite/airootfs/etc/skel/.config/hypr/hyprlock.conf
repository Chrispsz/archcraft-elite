# Archcraft ELITE · hyprlock — a tela de lock do rice (v8 — BLOCO 4)
# (entregue por craft-rice — a lock skin da casa; o marcador autoriza o
#  craft-rice a renovar este arquivo em homes VIVOS: sem ele, ou fóssil
#  conhecido, o rice não toca — E91)
# ─────────────────────────────────────────────────────────────────────
# Substitui o swaylock (que travava numa tela branca estática — o fix
# visual mais pedido do burn test). hyprlock roda no labwc pelo protocolo
# ext-session-lock-v1 (labwc o implementa nativamente — labwc.github.io/
# integration; casos documentados: hyprlock #607/#211, labwc #3672).
#
# v5 (E100 — a diretriz do dono: "se a tela de bloqueio fosse mais próxima
#   daquela [o greeter do SDDM, a tela de saída de sessão]... ficar lá o
#   usuário, ter um relógio, talvez aquele esquema lá de data... menos
#   redundante, mais interessante visualmente"): a v5 é IRMÃ DO GREETER —
#   o MESMO sistema visual, adaptado ao lock. RELÓGIO GRANDE + DATA no
#   esquema do greeter ("domingo, 9 de novembro"); o FUNDO é O WALLPAPER
#   borrado (lei v2.5.0 do dono — continuidade com o desktop, nunca a
#   foto das janelas abertas).
#
#   ⚠ A LEI DO SINAL (o réu silencioso de TRÊS eras, provado no fonte do
#   hyprlock — IWidget::posFromHVAlign + Mat3x3::outputProjection: o eixo
#   Y do plano é PRA CIMA, y=0 é o PÉ da tela e y=H é a CABEÇA):
#     · valign = top    ⇒ position y NUNCA positivo — +300 são 300px
#       ACIMA da tela: o relógio da v1.7/v3/v4 JAMAIS renderizou;
#     · valign = bottom ⇒ position y NUNCA negativo;
#     · a suíte cobra a lei — conf com o sinal torto não passa da
#       porteira.
#
# v7 (E106 — A TELA LIMPA): o bloco avatar, a pílula do usuário, o glifo
#   e o NOME SAÍRAM INTEIROS — o lock fica com RELÓGIO + DATA no alto, o
#   campo de senha no centro e o rodapé de status.
#
# v8 (BLOCO 4 — A PALETA OFICIAL DA CASA, a diretriz da Diretriz Mestre):
#   o lock veste OS MESMOS TOKENS do desktop (docs/skills/
#   02-paleta-oficial.md — a era das paletas irmãs por aproximação acaba:
#   o v5/v7 aproximava o theme.conf antigo do SDDM #D8D8D8/#5294E2/#E06B74,
#   hoje o desktop inteiro veste Catppuccin Mocha + acento purple-500 e
#   o lock ficou atrás):
#     · RELÓGIO/TÍTULO nítido #f8fafc (o token elite-text-bright — o
#       mesmo do relógio da barra) · DATA #cdd6f4 (elite-text);
#     · O CAMPO veste a ilha #181825 translúcida (elite-bg-dock — a mesma
#       superfície da dock) com borda INATIVA grafite #262637
#       (elite-border) e borda ATIVA/VALIDANDO em roxo #a855f7
#       (elite-accent — o foco é PONTO de acento, não área);
#     · ERRO #f38ba8 (elite-danger — o mesmo vermelho dos botões muted);
#     · TEXTO digitado #cdd6f4 · RODAPÉ #a9a3c2 (elite-text-dim);
#     · SOMBRA/escurecimento #11111b (elite-base — nunca preto puro);
#     · O RAIO de canto 20px — O MESMO raio da dock (#dockbox no
#       theme.css) e dos corpos de ilha; a pílula-27 da era greeter
#       antigo se aposenta com ele;
#     · O GREETER é irmã de verdade agora: o theme.conf do SDDM (a pele
#       override do BLOCO 4) veste os MESMOS valores — as duas telas são
#       UMA família, não duas aproximações.
#   Blur leve mantido (blur_passes 3 · blur_size 8 — o custo é do instante
#   do lock, zero consumo residual durante a sessão ativa).
#
# Acionado por: swayidle (craft-idle), craft-lock (W-l/menu/sono — o
# craft-lock renova a pele ANTES de cada lock, E100) e o sleep-hook.
# Sintaxe: wiki.hyprland.org/Hypr-Ecosystem/hyprlock.

$font = Iosevka Nerd Font

general {
    hide_cursor = false
    # 1.0-108 — O MAPEAMENTO INSTANTÂNEO (a evidência do rig: o lock nascia
    # com UMA piscada preta — o fade-in de era cobria o primeiro frame
    # antes do wallpaper; a diretriz do dono: --immediate no craft-lock E
    # no_fade_in aqui — o lock chega VESTIDO no frame 0, sem tempo de
    # transição nenhuma; o fadeOut curto do unlock segue (a senha dada
    # abre rápido, a CHEGADA nunca mais pisca).
    no_fade_in = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    # E88 — o fade ágil: o lock chega na hora
    # 1.0-108 — A CHEGADA É INSTANTÂNEA: o fadeIn de era (1, 3, linear)
    # era a piscada preta antes do wallpaper — o general { no_fade_in }
    # acima (com o --immediate do craft-lock) manda o frame 0 VESTIDO;
    # o fade_out da senha segue curto (a saída nunca foi o réu)
    # E110 — o destravo é INSTANTÂNEO (o dono: 'poderia ser praticamente
    # instantânea... você só coloca a senha e ele já abre muito rápido') —
    # o fadeOut 5 era 0.5s de trevas pós-senha no caminho sem sono
    animation = fadeIn, 1, 3, linear
    animation = fadeOut, 1, 1, linear
    animation = inputFieldDots, 1, 2, linear
}

# ── Fundo: O WALLPAPER, borrado ────────────────────────────────────────
# (o craft-lock REESCREVE o path por sessão; este é o default do hyprlock
#  invocado direto — loginctl lock-session)
background {
    monitor =
    path = ~/.config/labwc/wallpaper.png
    blur_passes = 3
    blur_size = 8
    brightness = 0.700000
    noise = 0.011000
    contrast = 0.890000
}

# ── Relógio (o corpo da casa na escala do greeter; E103: 100px no terço
#    superior — y=-150, valign=top, PRA BAIXO — a lei do sinal) ─────────
label {
    monitor =
    text = $TIME
    color = rgba(248, 250, 252, 1.0)            # elite-text-bright #f8fafc (o relógio da barra veste o mesmo)
    font_size = 100
    font_family = $font Bold
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(17, 17, 27, 0.65)       # elite-base #11111b (nunca preto puro)
    shadow_boost = 0.4

    position = 0, -150
    halign = center
    valign = top
}

# ── A data NO ESQUEMA DO GREETER ("domingo, 9 de novembro") ────────────
label {
    monitor =
    text = cmd[update:30000] date +"%A, %-d de %B"
    color = rgba(205, 214, 244, 1.0)            # elite-text #cdd6f4
    font_size = 24
    font_family = $font Bold
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(17, 17, 27, 0.6)        # elite-base #11111b
    shadow_boost = 0.4

    position = 0, -300
    halign = center
    valign = top
}

# ── O CAMPO (a ilha da casa: borda inativa #262637, foco/validando
#    #a855f7, erro #f38ba8 — a gramática de estados do theme.css) ───────
# E106 — v7: SEM avatar/pílula/nome acima — o campo é o ÚNICO corpo do
# centro (a ordem do dono: nada entre o relógio e as credenciais).
input-field {
    monitor =
    size = 380, 54
    outline_thickness = 2                       # a espessura da borda da casa (focus outline 2px do guia 03)
    rounding = 20                               # O RAIO DA DOCK (#dockbox) — a era pílula-27 se aposenta

    inner_color = rgba(24, 24, 37, 0.55)        # elite-bg-dock #181825 (a ilha translúcida)
    outer_color = rgba(38, 38, 55, 1.0)         # elite-border #262637 (borda inativa — grafite)
    check_color = rgba(168, 85, 247, 1.0)       # elite-accent #a855f7 (o foco/digitação é PONTO de acento)
    fail_color = rgba(243, 139, 168, 0.95)      # elite-danger #f38ba8 (o erro da casa)
    font_color = rgba(205, 214, 244, 1.0)       # elite-text #cdd6f4

    font_family = $font
    fade_on_empty = false
    placeholder_text = Senha
    fail_text = Senha Incorreta
    check_text = Validando

    # pontos ● do hyprlock (o default; dots_spacing da casa)
    dots_spacing = 0.3
    hide_input = false

    position = 0, -44
    halign = center
    valign = center
}

# ── O RODAPÉ DE STATUS (E103 — a hierarquia fecha: estado no pé, 0.6) ──
# valign=bottom com y POSITIVO (a LEI DO SINAL: bottom nunca leva y
# negativo — y>0 sobe do chão da tela). Uma voz só: o estado da sessão.
label {
    monitor =
    text = sessão bloqueada
    color = rgba(169, 163, 194, 0.6)            # elite-text-dim #a9a3c2 a 0.6 (a opacidade da missão)
    font_size = 12
    font_family = $font

    position = 0, 18
    halign = center
    valign = bottom
}
