# Archcraft ELITE · hyprlock — a tela de lock do rice (v3 — E88)
# ─────────────────────────────────────────────────────────────────────
# Substitui o swaylock (que travava numa tela branca estática — o fix
# visual mais pedido do burn test). hyprlock roda no labwc pelo protocolo
# ext-session-lock-v1 (labwc o implementa nativamente — labwc.github.io/
# integration; casos documentados: hyprlock #607/#211, labwc #3672).
#
# v1.7 — OS 3 DEFEITOS DO BURN TEST DA v1.6.2 (fotos do dono), curados:
#   1. PLACEHOLDER COM MARCAÇÃO CRU — a marcação Pango aparecia LITERAL
#      na tela: o hyprlock NÃO parseia markup no placeholder (o
#      example.conf oficial usa texto plano: "Input password...").
#      Cura: texto PLANO em placeholder/fail/check — as CORES já são
#      propriedade própria (check_color/fail_color/font_color), a
#      marcação era redundante e só vazava.
#   2. O "A" GIGANTE — o avatar (logo do Archcraft) saiu do lock
#      (pergunta literal do dono no burn test). Lock minimalista: fundo
#      desfocado + relógio + data + usuário + campo. Quem quiser avatar
#      de volta é uma colagem do bloco image do exemplo oficial
#      (wiki.hyprland.org/Hypr-Ecosystem/hyprlock).
#   3. RELÓGIO NA BORDA — valign=top com offset 48 encostava no topo
#      (e sumia atrás da light bar do monitor). Agora: relógio a 300px
#      do topo e data a 440 — terço superior, com respiro, em qualquer
#      resolução (1080p→4K).
#
# v3 (E88 — a diretriz do dono: "a própria tela de bloquear, deixa ela
#   mais interessante"): o lock GANHA PROFUNDIDADE sem virar painel de
#   avião — cinco gestos, todos na gramática Catppuccin do rice:
#   (1) RELÓGIO COM CORPO — 110px + sombra dupla (o número deixa de ser
#       texto chapado no blur e ganha leitura em qualquer wallpaper);
#   (2) A SAUDAÇÃO — Bom dia/tarde/noite, chris (cmd com update: 10min —
#       o lock que reconhece quem chega; quem chega às 07:50 lê "Bom
#       dia", não a mesma frase de sempre);
#   (3) O CARD — shape translúcido crust (0.55) com sombra atrás do
#       usuário + campo: a senha mora numa superfície DE VERDADE, não
#       flutuando solta; o blur do wallpaper atravessa o card (a
#       identidade do lock da Elite intacta);
#   (4) A DICA — "Digite a senha e pressione Enter" no rodapé (overlay1
#       discreto — quem nunca viu o lock sabe o gesto em 1 leitura);
#   (5) O FADE ÁGIL — fadeIn 5→3 (o lock chega NA HORA: a mesma diretriz
#       zero-delay da E88 para dock e menus).
#
# DESIGN (especificação do dono, v1.5 · ATUALIZADA na v2.5.0): fundo = O
#   WALLPAPER do desktop (o mesmo do swaybg) + blur alto + dim; relógio
#   GRANDE + data; campo com borda mauve, placeholder "Digite a senha para
#   desbloquear", SEMPRE visível (fade_on_empty = false); asteriscos
#   (dots_text_format = *), "Validando…" âmbar durante o PAM, "Senha
#   Incorreta" vermelho na falha.
#   v2.5.0 — o dono: "ele deve ficar só o wallpaper com Blur e não mostrar
#   as janelas abertas e etc como o PC estava antes de ir pra tela de
#   bloqueio/idle". O path=screenshot (foto da TELA — janelas incluídas)
#   saiu: quem garante o arquivo certo é o craft-lock (png→jpg, a MESMA
#   cadeia do swaybg; sem nenhum wallpaper, o color do bloco assume —
#   preto AMOLED, o mesmo fallback do autostart). O default aqui cobre o
#   hyprlock invocado sem o craft-lock (loginctl lock-session).
#
# Acionado por: swayidle (craft-idle: lock min → apagar min+5 · before-
# sleep), craft-lock (atalho/labwc menu) e craft-logout.
# Sintaxe: wiki.hyprland.org/Hypr-Ecosystem/hyprlock (example.conf).

$font = JetBrainsMono NF

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    # v3/E88 — o fade ágil: o lock chega na hora (5→3; o blur do wallpaper
    # continua transitando suave, sem o 'chegou devagar' que a era lenta
    # fazia parecer comportamento)
    animation = fadeIn, 1, 3, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# ── Fundo: O WALLPAPER, borrado ────────────────────────────────────────
# v2.5.0 — path=wallpaper (NÃO screenshot): o lock não revela o que
# estava aberto. blur alto + brightness .70 = o dim da spec — o wallpaper
# da Elite é dark premium (luma média 30.1 — arte v2.8) e .35 o apagava de vez;
# .70 mostra o blur sem estourar o contraste do relógio. noise sutil
# mata o banding do blur em painel escuro; contrast .89 assenta o véu.
# O craft-lock REESCREVE o path por sessão (png→jpg) num conf efêmero —
# esta linha é o default para um hyprlock direto.
background {
    monitor =
    path = ~/.config/labwc/wallpaper.png
    blur_passes = 3
    blur_size = 8
    brightness = 0.700000
    noise = 0.011000
    contrast = 0.890000
}

# ── Relógio GRANDE no terço superior (v3: com corpo — sombra dupla) ────
label {
    monitor =
    text = $TIME
    color = rgba(205, 214, 244, 1.0)            # text
    font_size = 110
    font_family = $font
    # v3/E88 — a sombra dá LEITURA em wallpaper claro e corpo no dark
    # premium (o número deixa de flutuar chapado no blur)
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(17, 17, 27, 0.65)
    shadow_boost = 0.4

    position = 0, 290
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:30000] date +"%A · %d %B %Y"
    color = rgba(108, 112, 134, 1.0)            # overlay1
    font_size = 22
    font_family = $font

    position = 0, 440
    halign = center
    valign = top
}

# ── A SAUDAÇÃO (v3/E88 — o lock reconhece quem chega) ─────────────────
# shell puro, sem aspas (o hyprlock entrega ao sh via popen — o texto
# plain é lei v1.7): 0-4 madrugada · 5-11 dia · 12-17 tarde · 18-23 noite
label {
    monitor =
    text = cmd[update:600000] h=$(date +%H); if [ $h -lt 5 ]; then echo Boa madrugada, $(whoami); elif [ $h -lt 12 ]; then echo Bom dia, $(whoami); elif [ $h -lt 18 ]; then echo Boa tarde, $(whoami); else echo Boa noite, $(whoami); fi
    color = rgba(203, 166, 247, 0.85)           # mauve — o acento do rice
    font_size = 24
    font_family = $font

    position = 0, 505
    halign = center
    valign = top
}

# ── O CARD (v3/E88 — a senha mora numa superfície, não solta no blur) ──
# shape ANTES dos labels/input (o hyprlock renderiza na ordem do conf):
# crust translúcido 0.55 + sombra — o blur do wallpaper atravessa (a
# identidade intacta) e o campo ganha endereço de verdade.
shape {
    monitor =
    size = 470, 200
    rounding = 24
    color = rgba(17, 17, 27, 0.55)              # crust translúcido
    border_size = 0
    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(17, 17, 27, 0.5)
    shadow_boost = 0.5

    position = 0, -20
    halign = center
    valign = center
}

# ── Nome do usuário (dentro do card — a metade de cima) ───────────────
label {
    monitor =
    text = $USER
    color = rgba(205, 214, 244, 0.92)           # text
    font_size = 26
    font_family = $font

    position = 0, 42
    halign = center
    valign = center
}

# ── Campo de senha (dentro do card — a metade de baixo) ───────────────
input-field {
    monitor =
    size = 380, 52
    outline_thickness = 3
    rounding = 14

    # caixa: preto AMOLED translúcido (o blur do fundo atravessa)
    inner_color = rgba(17, 17, 27, 0.72)        # crust
    outer_color = rgba(203, 166, 247, 1.0)      # mauve — a borda estilizada
    check_color = rgba(249, 226, 175, 0.85)     # yellow — validando
    fail_color = rgba(243, 139, 168, 0.95)      # red — senha incorreta
    font_color = rgba(205, 214, 244, 1.0)       # text

    font_family = $font
    fade_on_empty = false
    # v1.7: TEXTO PLANO — o hyprlock não parseia markup no placeholder
    # (a cor do texto é font_color; a do placeholder herda dela)
    placeholder_text = Digite a senha para desbloquear
    fail_text = Senha Incorreta
    check_text = Validando…

    # asteriscos no lugar dos dots (spec: feedback de digitação)
    dots_text_format = *
    dots_size = 0.38
    dots_spacing = 0.3
    hide_input = false

    position = 0, -34
    halign = center
    valign = center
}

# ── A DICA (v3/E88 — o gesto em uma leitura, no rodapé) ───────────────
label {
    monitor =
    text = Digite a senha e pressione Enter
    color = rgba(108, 112, 134, 0.9)            # overlay1 discreto
    font_size = 15
    font_family = $font

    position = 0, 46
    halign = center
    valign = bottom
}
