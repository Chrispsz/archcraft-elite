# Archcraft ELITE · hyprlock — a tela de lock do rice (v6 — E103)
# (entregue por craft-rice — a lock skin da casa; o marcador autoriza o
#  craft-rice a renovar este arquivo em homes VIVOS: sem ele, ou fóssil
#  conhecido, o rice não toca — E91)
# ─────────────────────────────────────────────────────────────────────
# Substitui o swaylock (que travava numa tela branca estática — o fix
# visual mais pedido do burn test). hyprlock roda no labwc pelo protocolo
# ext-session-lock-v1 (labwc o implementa nativamente — labwc.github.io/
# integration; casos documentados: hyprlock #607/#211, labwc #3672).
#
# v5 (E100 — a diretriz do dono: "se a tela de bloqueio fosse mais próxima
#   daquela [o greeter do SDDM, a tela de saída de sessão]... ficar lá o
#   usuário, ter um relógio, talvez aquele esquema lá de data... menos
#   redundante, mais interessante visualmente"): a v5 é IRMÃ DO GREETER —
#   o MESMO sistema visual do archcraft-sddm-theme 2.0 (a tela que o dono
#   aplaudiu ao sair da sessão), adaptado ao lock:
#     · A FONTE DO GREETER: Iosevka (kde_settings.conf Font=Iosevka; a
#       variante Nerd Font da casa tem os MESMOS traços + o glifo do
#       usuário na própria família — sem fallback cruzado);
#     · A PALETA DO GREETER (theme.conf do tema): texto #D8D8D8,
#       secundário #ABB2BF, borda #5a6477, superfície #1E2128,
#       validando #5294E2, erro #E06B74 — as duas telas lêem como irmãs;
#     · RELÓGIO GRANDE + DATA NO ESQUEMA DO GREETER: "domingo,
#       9 de novembro" (a família do DateFormat "dddd, MMMM d" do tema,
#       na locale da sessão — pt_BR na casa);
#     · O USUÁRIO FICA NA TELA (o dono: "permanecer ali — na troca de
#       sessão é que troca o usuário"): a PÍLULA do greeter com o glifo
#       + o nome real (GECOS como o UseRealName=true do tema; fallback
#       no login);
#     · AS PÍLULAS do greeter: campos 380×54, rounding 27 (pílula cheia
#       — o RoundCorners=100 do tema), borda 2px; o card crust 470×120
#       da v4 se aposenta (o greeter não tem cartão atrás dos campos);
#     · UMA voz para o gesto: placeholder "Senha" (o greeter também usa
#       uma palavra); ZERO saudação, ZERO dica de rodapé, ZERO texto
#       solto; os pontos ● voltam ao default do hyprlock;
#     · O FUNDO é O WALLPAPER borrado (lei v2.5.0 do dono — o greeter
#       tem fundo sólido próprio; o lock adapta: continuidade com o
#       desktop, nunca a foto das janelas abertas).
#
#   ⚠ A LEI DO SINAL (o réu silencioso de TRÊS eras, provado no fonte do
#   hyprlock — IWidget::posFromHVAlign + Mat3x3::outputProjection: o eixo
#   Y do plano é PRA CIMA, y=0 é o PÉ da tela e y=H é a CABEÇA):
#     · valign = top    ⇒ position y NUNCA positivo — +300 são 300px
#       ACIMA da tela: o relógio da v1.7/v3/v4 JAMAIS renderizou (o dono
#       pediu um relógio em três eras seguidas — e a suíte, que lê
#       strings, não enxergava pixels);
#     · valign = bottom ⇒ position y NUNCA negativo;
#     · a suíte cobra a lei (40-integration, E100) — conf com o sinal
#       torto não passa da porteira.
#
# v6 (E103 — a hierarquia vertical da missão de polimento do dono):
#   RELÓGIO no terço superior · AVATAR 1:1 RIGOROSO (fonte QUADRADA
#   recortada pelo craft-lock em ~/.cache/elite/avatar.png — rounding=-1
#   sobre quadrado é CÍRCULO, nunca elipse: o corte assimétrico morre) ·
#   AVATAR + NOME + SENHA centralizados com GAP DE 24PX entre os blocos ·
#   RODAPÉ de status a 0.6 de opacidade (a hierarquia fecha: relógio no
#   alto, corpo no centro, estado embaixo). Aritmética vertical (1080p):
#     relógio 150 · data 300 · avatar 360-456 · pílula 480-534 ·
#     senha 557-611 · rodapé no chão — TODOS os gaps ≥ 24px.
#
# Acionado por: swayidle (craft-idle), craft-lock (W-l/menu/sono — o
# craft-lock renova a pele ANTES de cada lock, E100) e o sleep-hook.
# Sintaxe: wiki.hyprland.org/Hypr-Ecosystem/hyprlock.

$font = Iosevka Nerd Font

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    # E88 — o fade ágil: o lock chega na hora
    animation = fadeIn, 1, 3, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# ── Fundo: O WALLPAPER, borrado ────────────────────────────────────────
# (o craft-lock REESCREVE o path por sessão; este é o default do hyprlock
#  invocado direto — loginctl lock-session)
background {
    monitor =
    path = ~/.config/labwc/wallpaper.png
    blur_passes = 3
    blur_size = 8
    brightness = 0.700000
    noise = 0.011000
    contrast = 0.890000
}

# ── Relógio (o corpo da casa na ESCALA do greeter; E103: 100px no terço
#    superior — y=-150, valign=top, PRA BAIXO desta vez — a lei do sinal) ─
label {
    monitor =
    text = $TIME
    color = rgba(216, 216, 216, 1.0)            # greeter: TimeTextColor #D8D8D8
    font_size = 100
    font_family = $font Bold
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(17, 17, 27, 0.65)
    shadow_boost = 0.4

    position = 0, -150
    halign = center
    valign = top
}

# ── A data NO ESQUEMA DO GREETER ("domingo, 9 de novembro") ────────────
label {
    monitor =
    text = cmd[update:30000] date +"%A, %-d de %B"
    color = rgba(216, 216, 216, 1.0)            # greeter: DateTextColor #D8D8D8
    font_size = 24
    font_family = $font Bold
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(17, 17, 27, 0.6)
    shadow_boost = 0.4

    position = 0, -300
    halign = center
    valign = top
}

# ── O AVATAR 1:1 (E103 — a diretriz: proporção 1:1 rigorosa, círculo
#    perfeito, sem corte assimétrico) ─────────────────────────────────────
# A FONTE é sempre QUADRADA: o craft-lock recorta (ffmpeg crop min(iw,ih)
# + scale 256) a foto do dono (~/.config/elite/avatar.png ou ~/.face) para
# o cache ANTES de cada lock. rounding=-1 sobre fonte quadrada = CÍRCULO;
# sobre retangular seria ELIPSE — a assimetria que o dono mandou eliminar.
# Sem avatar em cache? O widget não renderiza (o hyprlock pula o bloco) —
# a pílula do glifo abaixo segura o papel com a mesma graça.
image {
    monitor =
    path = ~/.cache/elite/avatar.png
    size = 96
    rounding = -1                             # círculo PERFEITO (fonte quadrada)
    border_size = 2
    border_color = rgba(90, 100, 119, 1.0)    # greeter: LoginFieldBorderColor #5a6477
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(17, 17, 27, 0.5)
    shadow_boost = 0.5

    position = 0, -360
    halign = center
    valign = top
}

# ── A PÍLULA DO USUÁRIO (o greeter mostra quem entra; o lock mantém) ───
# shape ANTES dos labels (o hyprlock renderiza na ordem do conf): borda
# #5a6477 de 2px, superfície #1E2128 translúcida — o blur atravessa e a
# pílula ganha corpo sobre qualquer wallpaper. E103: centro em +33 (a
# pílula 54px cobre 480..534 — o gap do avatar é 24px EXATO).
shape {
    monitor =
    size = 380, 54
    rounding = 27
    color = rgba(30, 33, 40, 0.55)              # greeter: FormBackgroundColor #1E2128
    border_size = 2
    border_color = rgba(90, 100, 119, 1.0)      # greeter: LoginFieldBorderColor #5a6477
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(17, 17, 27, 0.5)
    shadow_boost = 0.5

    position = 0, 33
    halign = center
    valign = center
}

# glifo do usuário à esquerda dentro da pílula (U+F007 na NF da casa —
# o greeter desenha o dele em SVG; mesma posição vertical da pílula)
label {
    monitor =
    text = 
    color = rgba(171, 178, 191, 1.0)            # greeter: UserIconColor #ABB2BF
    font_size = 18
    font_family = $font

    position = -162, 33
    halign = center
    valign = center
}

# o NOME (GECOS como o UseRealName=true do greeter; fallback no login —
# hyprlock roda o cmd via /bin/sh: sem [ ] no comando, o ] fecharia o cmd)
label {
    monitor =
    text = cmd[update:60000] n=$(getent passwd "$(id -un)" 2>/dev/null | cut -d: -f5 | cut -d, -f1); echo "${n:-$(id -un)}"
    color = rgba(171, 178, 191, 1.0)            # greeter: LoginFieldTextColor #ABB2BF
    font_size = 16
    font_family = $font
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(17, 17, 27, 0.55)

    position = 0, 33
    halign = center
    valign = center
}

# ── O CAMPO (a pílula do greeter: borda 2px #5a6477, pílula cheia) ─────
# E103 — O GAP DE 24PX: centro a 78px da pílula do nome (78 - 54 = 24px
# de ar entre os blocos — a missão: 'avatar + campo de senha centralizados
# com gap de 24px'). Centro em -44: a pílula cobre 557..611.
input-field {
    monitor =
    size = 380, 54
    outline_thickness = 2                       # greeter: InputFieldBorderWidth
    rounding = 27

    inner_color = rgba(30, 33, 40, 0.55)        # greeter: FormBackgroundColor translúcido
    outer_color = rgba(90, 100, 119, 1.0)       # greeter: LoginFieldBorderColor
    check_color = rgba(82, 148, 226, 1.0)       # greeter: HighlightBackgroundColor #5294E2
    fail_color = rgba(224, 107, 116, 0.95)      # greeter: WarningColor #E06B74
    font_color = rgba(171, 178, 191, 1.0)       # greeter: PasswordFieldTextColor #ABB2BF

    font_family = $font
    fade_on_empty = false
    placeholder_text = Senha
    fail_text = Senha Incorreta
    check_text = Validando…

    # pontos ● do greeter (o default do hyprlock; dots_spacing da casa)
    dots_spacing = 0.3
    hide_input = false

    position = 0, -44
    halign = center
    valign = center
}

# ── O RODAPÉ DE STATUS (E103 — a hierarquia fecha: estado no pé, 0.6) ──
# valign=bottom com y POSITIVO (a LEI DO SINAL: bottom nunca leva y
# negativo — y>0 sobe do chão da tela). Uma voz só: o estado da sessão.
label {
    monitor =
    text = sessão bloqueada
    color = rgba(171, 178, 191, 0.6)            # #ABB2BF a 0.6 (a opacidade da missão)
    font_size = 12
    font_family = $font

    position = 0, 18
    halign = center
    valign = bottom
}
