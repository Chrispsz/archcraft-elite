# Archcraft ELITE · hyprlock — a tela de lock do rice (v4 — E97)
# (entregue por craft-rice — a lock skin da casa; o marcador autoriza o
#  craft-rice a renovar este arquivo em homes VIVOS: sem ele, ou fóssil
#  conhecido, o rice não toca — E91)
# ─────────────────────────────────────────────────────────────────────
# Substitui o swaylock (que travava numa tela branca estática — o fix
# visual mais pedido do burn test). hyprlock roda no labwc pelo protocolo
# ext-session-lock-v1 (labwc o implementa nativamente — labwc.github.io/
# integration; casos documentados: hyprlock #607/#211, labwc #3672).
#
# v4 (E97 — a diretriz do dono: "não gostei muito da nova tela de
#   bloqueio, achei que ficou REDUNDANTE as mensagens que tem nela,
#   poderia ter um relógio... um visual mais moderno"): a v3 empilhava
#   QUATRO blocos de texto além do relógio — data, saudação ("Boa tarde,
#   chris"), nome do usuário e a dica do rodapé ("Digite a senha e
#   pressione Enter"), somados ao placeholder do campo. Quatro vozes
#   dizendo o que o dono já sabe. A v4 é a lição de disciplina da casa:
#     · FICA o relógio GRANDE com corpo (110px + sombra dupla — a v3
#       acertou e é o pedido explícito do dono);
#     · FICA a data discreta (uma linha, overlay1);
#     · FICA o card da senha (o campo tem endereço de verdade);
#     · SAI a saudação (a tela não precisa conversar);
#     · SAI o nome do usuário (ele sabe o próprio nome);
#     · SAI a dica do rodapé (o placeholder do campo já diz o gesto);
#     · o card emagrece 200→120px: sem o username dentro, só o campo.
#   Três elementos. Nada na tela que não trabalhe.
#
# v1.7 — OS 3 DEFEITOS DO BURN TEST DA v1.6.2, curados: placeholder texto
#   PLANO (hyprlock não parseia markup), sem avatar (o "A" gigante saiu),
#   relógio no terço superior com respiro (não mais na borda).
# v2.5.0 — o fundo é O WALLPAPER (nunca screenshot com janelas); o
#   craft-lock reescreve o path por sessão (png→jpg, a cadeia do swaybg).
# v3 (E88) — relógio com corpo, saudação, card, dica e fade ágil (a v4
#   aposenta saudação e dica — a redundância que o dono nomeou).
#
# Acionado por: swayidle (craft-idle), craft-lock (W-l/menu) e o
# sleep-hook. Sintaxe: wiki.hyprland.org/Hypr-Ecosystem/hyprlock.

$font = JetBrainsMono NF

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    # E88 — o fade ágil: o lock chega na hora
    animation = fadeIn, 1, 3, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# ── Fundo: O WALLPAPER, borrado ────────────────────────────────────────
# (o craft-lock REESCREVE o path por sessão; este é o default do hyprlock
#  invocado direto — loginctl lock-session)
background {
    monitor =
    path = ~/.config/labwc/wallpaper.png
    blur_passes = 3
    blur_size = 8
    brightness = 0.700000
    noise = 0.011000
    contrast = 0.890000
}

# ── Relógio GRANDE no terço superior (o pedido do dono; corpo da v3) ───
label {
    monitor =
    text = $TIME
    color = rgba(205, 214, 244, 1.0)            # text
    font_size = 110
    font_family = $font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(17, 17, 27, 0.65)
    shadow_boost = 0.4

    position = 0, 290
    halign = center
    valign = top
}

# ── A data (uma linha discreta — o resto é silêncio) ───────────────────
label {
    monitor =
    text = cmd[update:30000] date +"%A · %d %B %Y"
    color = rgba(108, 112, 134, 1.0)            # overlay1
    font_size = 22
    font_family = $font

    position = 0, 440
    halign = center
    valign = top
}

# ── O CARD da senha (v4: emagrecido — só o campo, sem username) ────────
# shape ANTES do input (o hyprlock renderiza na ordem do conf): crust
# translúcido 0.55 + sombra — o blur do wallpaper atravessa e o campo
# ganha endereço de verdade.
shape {
    monitor =
    size = 470, 120
    rounding = 24
    color = rgba(17, 17, 27, 0.55)              # crust translúcido
    border_size = 0
    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(17, 17, 27, 0.5)
    shadow_boost = 0.5

    position = 0, -20
    halign = center
    valign = center
}

# ── Campo de senha (dentro do card) ────────────────────────────────────
input-field {
    monitor =
    size = 380, 52
    outline_thickness = 3
    rounding = 14

    # caixa: preto AMOLED translúcido (o blur do fundo atravessa)
    inner_color = rgba(17, 17, 27, 0.72)        # crust
    outer_color = rgba(203, 166, 247, 1.0)      # mauve — a borda estilizada
    check_color = rgba(249, 226, 175, 0.85)     # yellow — validando
    fail_color = rgba(243, 139, 168, 0.95)      # red — senha incorreta
    font_color = rgba(205, 214, 244, 1.0)       # text

    font_family = $font
    fade_on_empty = false
    # v1.7: TEXTO PLANO — o hyprlock não parseia markup no placeholder
    placeholder_text = Digite a senha para desbloquear
    fail_text = Senha Incorreta
    check_text = Validando…

    # asteriscos no lugar dos dots (spec: feedback de digitação)
    dots_text_format = *
    dots_size = 0.38
    dots_spacing = 0.3
    hide_input = false

    position = 0, 0
    halign = center
    valign = center
}
