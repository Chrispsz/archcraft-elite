# ── ELITE v1.1 · Helix — editor modal (Rust), tema Catppuccin Mocha ─────
# ~ substitui vim/mousepad (MEGA PROMPT: ferramentas TUI modernas).
# LSP: `hx --health` lista servers; instale com pacman (rust-analyzer…).

theme = "catppuccin_mocha"

[editor]
line-number      = "relative"
cursorline       = true
color-modes      = true
true-color       = true
idle-timeout     = 50        # completions rápidas sem travar o input
bufferline       = "multiple"
soft-wrap.enable = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.statusline]
left  = ["mode", "spinner", "file-modification-indicator", "file-name"]
right = ["diagnostics", "selections", "position", "file-encoding", "file-line-ending", "file-type"]

[editor.auto-pairs]
"(" = ")"
"{" = "}"
"[" = "]"
"\"" = "\""
"'" = "'"
"`" = "`"

[keys.normal]
"C-s"     = ":write"
"C-q"     = ":quit"
"esc"     = ["keep_primary_selection", "collapse_selection"]
