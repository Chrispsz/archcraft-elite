# ── ELITE E70 · VS Code — Wayland nativo + a moldura do compositor ──────
# (lido pelo launcher do code da Arch — padrão code-flags.conf)
#
# O print do dono (06/nov 20:46): o VS Code nascia XWayland e desenhava a
# titlebar PRÓPRIA (~36px, estilo próprio) ao lado das titlebars SSD de
# 22px do compositor — dois sistemas de moldura num só desktop. Com o
# Wayland nativo, a janela negocia xdg-decoration e a regra universal da
# casa (rc.xml mestre — E123: <windowRule serverDecoration="yes"/> no
# ÚNICO arquivo de regras que o labwc lê) entrega ao VS Code a MESMA
# moldura de TODAS as janelas.
--enable-features=UseOzonePlatform
--ozone-platform=wayland
# E134 — O CHAVEIRO NUNCA É ACORDADO (a ordem do dono 1.0-81: o fim do
# gnome-keyring da casa — as senhas do navegador/editor moram NO PERFIL
# do app com --password-store=basic, nenhuma ponte Secret Service, zero
# popup de desbloqueio). O mesmo flag do brave-flags.conf (E115).
--password-store=basic
