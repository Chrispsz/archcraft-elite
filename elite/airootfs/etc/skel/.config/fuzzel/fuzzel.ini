; Archcraft Cockpit · fuzzel — Launcher (Catppuccin Mocha)
; Chaves conforme fuzzel.ini(5) oficial — cores em RRGGBBAA (sem #).

[main]
; v2.1: família REAL do archcraft-fonts 2.0 ("JetBrainsMono NF" — a antiga
; "JetBrainsMono Nerd Font" não existe; weight=medium idem: só Regular/Bold)
font=JetBrainsMono NF:weight=regular:size=12
dpi-aware=no
prompt="❯  "
icon-theme=Papirus-Dark
icons-enabled=yes
terminal=foot
anchor=top
layer=overlay
lines=10
width=26
horizontal-pad=18
inner-pad=10
line-height=32
match-mode=fzf
show-actions=no

[colors]
background=1e1e2eff
text=cdd6f4ff
prompt=89b4faff
input=cdd6f4ff
match=f5c2e7ff
selection=313244ff
selection-text=cdd6f4ff
selection-match=89b4faff
border=89b4faff

[border]
width=2
radius=12
