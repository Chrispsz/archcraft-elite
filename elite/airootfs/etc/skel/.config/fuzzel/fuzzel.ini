# Archcraft ELITE · fuzzel — Launcher (AMOLED rice · v1.3)
# Chaves conforme fuzzel.ini(5) oficial — cores em RRGGBBAA (sem #).
# v1.3: a suíte agora PARSEIA este INI de verdade (configparser, seções
# main+colors) — cabeçalho de seção é contrato, não decorativo.

[main]
# v2.1: família REAL do archcraft-fonts 2.0 ("JetBrainsMono NF" — a antiga
# "JetBrainsMono Nerd Font" não existe; weight=medium idem: só Regular/Bold)
font=JetBrainsMono NF:weight=regular:size=12
dpi-aware=no
prompt="❯  "
# v2.2 (leveza radical): sem chave de tema de ícones — o pacote saiu do
# packages.add (diretriz do dono); lookups caem no fallback base do GTK.
icons-enabled=yes
terminal=foot
anchor=top
layer=overlay
lines=10
width=26
horizontal-pad=18
inner-pad=10
line-height=32
match-mode=fzf
show-actions=no
# v2.3.6 — FOCO on-demand (o rig flagrou: menu preso na tela mesmo
# clicando fora). Em exclusive (default do fuzzel) o grab engole o clique
# fora e nada fecha; em on-demand o clique fora devolve o foco e o fuzzel
# fecha sozinho (exit-on-keyboard-focus-loss, default yes). Teclado segue
# entrando: o labwc foca a layer on-demand quando ela mapeia.
keyboard-focus=on-demand
# v2.4.0 — A LEI do fechar EXPLÍCITA: perder o foco FECHA. É a física que
# virou a lei dos menus (toggle: o 2º clique no botão fecha; cross-dismiss:
# abrir outro menu fecha o primeiro — o burn test v1.4 do Sessão provou).
# O default já era yes; agora é CONTRATO escrito, à prova de drift.
# v2.10.12 — O NOME CERTO (dump nl3z: err do fuzzel 1.15 'not a valid
# option: exit-on-focus-loss' em TODO abrir de menu): a opção do fuzzel
# chama-se exit-on-keyboard-focus-loss (o próprio comentário acima sabia
# o nome) — o contrato escrito tinha um typo que poluía cada abertura.
exit-on-keyboard-focus-loss=yes

[colors]
# v1.3 AMOLED: base preta com véu de 2% (não 0% — o véu separa o popup do
# wallpaper preto) · prompt/borda/seleção-match em MAUVE (assinatura do
# rice — era blue default Catppuccin, o dono pediu identidade lilás)
background=000000f2
text=cdd6f4ff
prompt=cba6f7ff
input=cdd6f4ff
match=f5c2e7ff
selection=22222eff
selection-text=cdd6f4ff
selection-match=cba6f7ff
border=cba6f7ff

[border]
width=2
radius=12
