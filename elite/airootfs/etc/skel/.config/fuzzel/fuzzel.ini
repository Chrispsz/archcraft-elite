# Archcraft ELITE · fuzzel — Launcher (AMOLED rice · v1.3)
# Chaves conforme fuzzel.ini(5) oficial — cores em RRGGBBAA (sem #).
# A suíte PARSEIA este INI (configparser, seções main+colors+border) —
# cabeçalho de seção é contrato, não decorativo.

[main]
# a família REAL do archcraft-fonts 2.0 ("JetBrainsMono NF"; weight=medium
# não existe — só Regular/Bold)
font=JetBrainsMono NF:weight=regular:size=12
dpi-aware=no
prompt="❯  "
# sem tema de ícones (o pacote saiu — lookups caem no fallback base do GTK)
icons-enabled=yes
terminal=foot
anchor=top
layer=overlay
lines=10
width=26
horizontal-pad=18
inner-pad=10
line-height=32
match-mode=fzf
show-actions=no
# FOCO on-demand: em exclusive o grab engole o clique fora e o menu fica
# preso na tela; em on-demand o clique fora devolve o foco e o fuzzel
# fecha sozinho. Teclado segue entrando (o labwc foca a layer on-demand).
keyboard-focus=on-demand
# o LAUNCHER fecha por perda de foco (a lei dos MENUS é outra e mora no
# craft-menu: pid do fuzzel → toggle/cross-dismiss determinísticos; foco
# não decide nada). O nome da opção é exit-on-keyboard-focus-loss (o
# typo 'exit-on-focus-loss' não existe no fuzzel 1.15 e cuspiria err em
# toda abertura).
exit-on-keyboard-focus-loss=yes

[colors]
# AMOLED: base preta com véu de 2% (o véu separa o popup do wallpaper
# preto) · prompt/borda/seleção-match em MAUVE (assinatura do rice)
background=000000f2
text=cdd6f4ff
prompt=cba6f7ff
input=cdd6f4ff
match=f5c2e7ff
selection=22222eff
selection-text=cdd6f4ff
selection-match=cba6f7ff
border=cba6f7ff

[border]
width=2
radius=12
