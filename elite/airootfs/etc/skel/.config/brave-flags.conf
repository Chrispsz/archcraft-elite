# ── ELITE v1.1 · Brave — Wayland nativo + aceleração de GPU completa ────
# (lido pelo launcher do brave-bin, no padrão chromium-flags.conf)
#
# Ozone/Wayland: janelas nativas do compositor (labwc decora, alt-tab do
# wlroots enxerga, sem fraquezas XWayland)
--enable-features=UseOzonePlatform,Vulkan,DefaultANGLEVulkan
--ozone-platform=wayland
# E30 (v2.10.18) — A DECORAÇÃO CERTA (dump p6aw + foto do dono: os botões
# estilo macOS ficavam nas janelas GTK e NÃO no navegador). O flag de
# decoração wayland do Chromium FORÇAVA CSD — o Brave desenhava a própria
# barra de título (botões dele, ignorando o tema). SEM o flag, o
# Chromium pede decoração ao COMPOSITOR (protocolo xdg-decoration) e o
# labwc desenha SSD igual às outras janelas — os MESMOS botões do foot.
# Plano B (se uma versão futura do Brave ignorar): o toggle "usar barra
# de título do sistema" em brave://settings/appearance produz o mesmo
# efeito por perfil.

# GPU: sem blocklist de software rendering, rasterização na GPU e
# zero-copy de buffers (tears-free, latência mínima em 200Hz)
--ignore-gpu-blocklist
--enable-gpu-rasterization
--enable-zero-copy

# VA-API (decode de vídeo por hardware — H.264/H.265/VP9/AV1):
# rig AMD (RADV/Mesa): descomente as duas linhas abaixo
# rig NVIDIA: requer nvidia-vaapi-driver (cockpit pós-install; ver docs)
#--enable-features=VaapiVideoDecodeLinuxGL,VaapiVideoEncoder
#--disable-features=UseChromeOSDirectVideoDecoder
