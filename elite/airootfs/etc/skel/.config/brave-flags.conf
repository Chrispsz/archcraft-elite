# ── ELITE v1.1 · Brave — Wayland nativo + aceleração de GPU completa ────
# (lido pelo launcher do brave-bin, no padrão chromium-flags.conf)
#
# Ozone/Wayland: janelas nativas do compositor (labwc decora, alt-tab do
# wlroots enxerga, sem fraquezas XWayland)
--enable-features=UseOzonePlatform,WaylandWindowDecorations,Vulkan,DefaultANGLEVulkan
--ozone-platform=wayland

# GPU: sem blocklist de software rendering, rasterização na GPU e
# zero-copy de buffers (tears-free, latência mínima em 200Hz)
--ignore-gpu-blocklist
--enable-gpu-rasterization
--enable-zero-copy

# VA-API (decode de vídeo por hardware — H.264/H.265/VP9/AV1):
# rig AMD (RADV/Mesa): descomente as duas linhas abaixo
# rig NVIDIA: requer nvidia-vaapi-driver (cockpit pós-install; ver docs)
#--enable-features=VaapiVideoDecodeLinuxGL,VaapiVideoEncoder
#--disable-features=UseChromeOSDirectVideoDecoder
