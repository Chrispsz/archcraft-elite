# ── ELITE v1.2 · Brave — Wayland nativo + GPU SEM vídeo branco ──────────
# (lido pelo launcher do brave-origin, no padrão chromium-flags.conf)
#
# E114 — O VÍDEO BRANCO MORREU (o relato do dono + o dump 183150: 'o
# YouTube tá ficando branco. Ele reproduz o áudio do vídeo, só que o
# vídeo fica em branco. Se eu passo o mouse no tempo de vídeo, eu consigo
# ver o preview, mas o vídeo em si eu não consigo ver'): o réu era a
# LINHA VULKAN da era v1.1 — o compositing Vulkan do Chromium sobre
# RADV/AMD (Navi 33) é a família conhecida do frame de vídeo que não
# desenha, enquanto o preview da timeline funciona (desenha por OUTRO
# caminho). A cura é o compositing GL — o caminho PADRÃO do Chromium no
# Linux, estável; o vsync do labwc/wlroots cuida do tearing (o que a era
# v1.1 queria do Vulkan). O conf segue até o rig vivo pelo pacote
# (/usr/local/share/elite/chromium-flags/) e o elite-post-transaction
# sincroniza o home — vale no PRÓXIMO abrir do navegador.
#
# Ozone: o HINT=auto decide pela sessão (a ordem do dono E132 — Wayland
# sob Wayland, X11 sob X11; o hint é a gramática atual do Chromium, mais
# resiliente que o fixo da era v1.2 em sessões aninhadas/steam)
--ozone-platform-hint=auto
# E30 (v2.10.18) — A DECORAÇÃO CERTA (dump p6aw + foto do dono: os botões
# estilo macOS ficavam nas janelas GTK e NÃO no navegador). O flag de
# decoração wayland do Chromium FORÇAVA CSD — o Brave desenhava a própria
# barra de título (botões dele, ignorando o tema). SEM o flag, o
# Chromium pede decoração ao COMPOSITOR (protocolo xdg-decoration) e o
# labwc desenha SSD igual às outras janelas — os MESMOS botões do foot.
# Plano B (se uma versão futura do Brave ignorar): o toggle "usar barra
# de título do sistema" em brave://settings/appearance produz o mesmo
# efeito por perfil.

# GPU: sem blocklist de software rendering, rasterização na GPU e
# zero-copy de buffers (latência mínima em 200Hz) — SEM compositing
# Vulkan: o vídeo branco (E114 acima) custa mais que o ganho teórico
--ignore-gpu-blocklist
--enable-gpu-rasterization
--enable-zero-copy

# VA-API (decode de vídeo por hardware — H.264/H.265/VP9/AV1):
# E129 — AS FLAGS VA-API ENTRAM EM PRODUÇÃO (a ordem do dono 2026-11-20:
# 'flags VA-API completas' — o decode por GPU não é mais comentário de
# manual): rig AMD (RADV/Mesa) e Intel (intel-media-driver) decodificam na
# GPU de fábrica; rig NVIDIA segue precisando do nvidia-vaapi-driver.
# CARGO HONESTO (a crônica do E114 fica): o compositing VULKAN continua
# FORA — o próprio rig do dono provou o frame de vídeo que não desenha
# sobre RADV (o YouTube branco do dump 183150); o GL é o compositing
# estável e o VA-API decodifica na GPU do MESMO jeito (decode ≠ compositing).
# E132 — o conjunto VA-API da ordem do dono (decode GL + ZEROCOPY GL — o
# frame copiado UMA vez, direto ao scanout — e o VaapiOnNvidiaGPUs para o
# dia do driver proprietário com o nvidia-vaapi-driver)
--enable-features=AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL,VaapiOnNvidiaGPUs
--disable-features=UseChromeOSDirectVideoDecoder

# E115 — O CHAVEIRO NUNCA MAIS É ACORDADO (o dono: 'eu não sei por que tem
# o chaveiro do GNOME, sendo que nosso sistema não é GNOME… nem era para
# ter esse chaveiro' + os popups de senha a cada boot do navegador, ×2):
# o gnome-keyring NÃO é o desktop GNOME — é o daemon da API Secret Service
# (onde apps guardam senhas), e o Chromium por padrão guarda as SUAS no
# chaveiro: com o autologin do sddm ninguém digita senha no boot (o papel
# canta 'gkr-pam: could not unlock' — dump seção 11), o chaveiro dorme
# fechado e o Brave pede a senha DE NOVO a cada abrir — o ×2 é a senha do
# login caindo no chaveiro que não a aceita. O --password-store=basic
# desliga a ponte: as senhas salvas do navegador moram NO PERFIL do Brave
# (Local State), o chaveiro nunca é consultado e NENHUM popup nasce.
# CARGO HONESTO: senhas de sites salvas antes ficam no chaveiro antigo —
# o Brave não as lê daí (salve de novo uma vez e elas passam a viver no
# perfil; sem chaveiro para esquecer senha). Reverter: remova esta linha
# e o Brave volta ao chaveiro do sistema.
--password-store=basic
