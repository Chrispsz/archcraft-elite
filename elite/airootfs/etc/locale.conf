# Archcraft ELITE · locale de FÁBRICA (E31 · v2.10.19)
# ─────────────────────────────────────────────────────────────────────────
# O DONO VIU "Mist 31 Oct" NO RELÓGIO E "Open Terminal Here" NO THUNAR —
# a mistura de inglês com pt-BR tinha UMA causa: a ISO não tinha
# /etc/locale.conf, então a sessão LIVE nascia em locale C (o strftime
# renderiza "Mon/Oct", o gettext dos apps cai no inglês).
#
# O pt_BR.UTF-8 JÁ É GERADO de fábrica desde o E15 (elite-customize.sh:
# locale.gen podado para en_US.UTF-8 + pt_BR.UTF-8, archive regenerado,
# auto-cura antes do fail) — faltava ESTE arquivo para a sessão USAR.
#   · LIVE: data "seg 31 out", "Abrir terminal aqui", tudo pt-BR;
#   · INSTALADO: o calamares escreve o locale.conf do idioma ESCOLHIDO na
#     instalação — este arquivo é o default de fábrica, não uma lei;
#   · RIG do dono: já nasceu pt_BR pelo instalador (dump nl3z:364,
#     "System Locale: LANG=pt_BR.UTF-8" — o papel provou).
# O relógio do waybar ganha ALÉM disso o locale EXPLÍCITO no config.top
# (o strftime do processo do waybar não depende da herança da sessão).
LANG=pt_BR.UTF-8
