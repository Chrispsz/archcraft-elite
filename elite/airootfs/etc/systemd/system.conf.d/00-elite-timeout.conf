# Fix do freeze do live em boot lento (diag-boot3 · v1.0.3)
# ═══════════════════════════════════════════════════════════════════════
# O cachyos-settings instala /usr/lib/systemd/system.conf.d/00-timeout.conf
# com DefaultTimeoutStartSec=15s — agressivo demais para boot a frio via
# USB/Ventoy/QEMU-TCG. Reproduzido no diag-boot3 (teste E, caminho real do
# systemd-boot): o systemd-resolved (Type=notify + Restart) não fica pronto
# em 15s → 'start operation timed out' → restart → timeout → restart…
# LOOP ETERNO → multi-user/graphical nunca completam → splash congelada
# (o sintoma exato do rig B, ambas as entradas de boot).
#
# Este drop-in em /etc/systemd/system.conf.d/ TEM PRECEDÊNCIA sobre o
# /usr/lib do pacote e devolve o padrão vanilla do systemd (90s).
# Quem quiser o 15s do CachyOS no sistema instalado:
#   sudo rm /etc/systemd/system.conf.d/00-elite-timeout.conf
[Manager]
DefaultTimeoutStartSec=90s
DefaultTimeoutStopSec=90s
