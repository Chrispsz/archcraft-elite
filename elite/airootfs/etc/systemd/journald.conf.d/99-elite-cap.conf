[Journal]
# Elite v1.8.1 → v2.3.7 — persistência com teto. ANTES: Storage=auto
# (padrão Arch) sem /var/log/journal = journal VOLÁTIL — cada reboot
# apagava a história (o plano do dono é 'dias ligado e só craft-dump
# --upload no fim'; sem persistência, o despertar do suspend de 2 dias
# atrás morria antes do dump). AGORA: journald cria o dir sozinho e
# guarda através de reboots, com o teto de btrfs já limitando o
# crescimento (SystemMaxUse). No live, o RuntimeMaxUse limita o /var/log
# no overlay de RAM (o persistent cria o dir no overlay — teto duplo).
SystemMaxUse=100M
RuntimeMaxUse=64M
Storage=persistent
