# ── ELITE v2.10.8 · política de sono explícita ────────────────────────────
# O dump d33o (rig, 10.7 instalado) provou: o kernel oferece 'freeze mem
# disk' e o mem_sleep default é [deep] — o hardware suspende de verdade.
# O 'loginctl can-suspend' da sessão respondeu ≠ yes; uma causa possível é
# AllowSuspend=no herdado de config de base (o dump v2.1 passa a coletar
# sleep.conf* para a perícia ver). Aqui a ISO FIXA a palavra final:
#
#  · suspend  = SIM  (S3 real; antes-sleep trava a tela — acorda no lock);
#  · hibernar = NUNCA — a ISO não escreve resume= no cmdline (o swap é
#    zram, sem partição de troca persistente): dormir sem endereço de
#    volta é promessa falsa — o que não pode acordar, não entra.
[Sleep]
AllowSuspend=yes
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
