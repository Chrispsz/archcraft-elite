# ── ELITE: zram estilo SteamOS/Fedora (este arquivo em /etc vence o do cachyos-settings)
# E135 — O DRIFT 150≠180 MORRE NA FONTE: o systemd-zram-setup@zram0
# aplicava o swappiness DEFAULT DO GERADOR (150) DEPOIS do
# systemd-sysctl — o 99-elite.conf mandava 180 e o live mostrava 150
# (o dump 101339 crava a dupla). A opção `swappiness` do
# zram-generator é A ÚLTIMA PALAVRA no swapon do gerador: a lei 180
# nasce junto com o dispositivo — nenhum After/re-run necessário.
[zram0]
zram-size = min(ram, 8192)
compression-algorithm = zstd
swappiness = 180
