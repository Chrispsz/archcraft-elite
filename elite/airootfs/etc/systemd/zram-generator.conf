# ── ELITE: zram estilo SteamOS (este arquivo em /etc vence o do cachyos-settings)
# zram0 de 8 GiB em zstd — o swap inteiro mora em RAM comprimida.
# E137 — A CHAVE MORTA SAI: `swappiness` NÃO é opção do zram-generator
# (o upstream a IGNORA com 'unknown key' no journal — a alegação E135 de
# que 'o gerador tem a última palavra no swapon' nunca foi verdade; a
# prova mora no config.rs do gerador: chave desconhecida → warn+ignore).
# QUEM FIXA O SWAPPINESS NO BOOT é a regra udev 81-elite-zram.rules —
# ela roda DEPOIS do 30-zram.rules do cachyos-settings (que escreve 150
# no evento do zram0) e recoloca o 180 da casa no MESMO evento.
[zram0]
zram-size = min(ram, 8192)
compression-algorithm = zstd
