# ── ELITE: zram estilo SteamOS/Fedora (este arquivo em /etc vence o do cachyos-settings)
# E135 — O DRIFT MORRE NA FONTE: o systemd-zram-setup@zram0 aplicava o
# swappiness DEFAULT DO GERADOR (150) DEPOIS do systemd-sysctl — a
# opção `swappiness` do zram-generator é A ÚLTIMA PALAVRA no swapon do
# gerador: a lei nasce junto com o dispositivo, nenhum After/re-run
# necessário.
# E136 — O NÚMERO DA LEI VIRA 15 (a MISSÃO PARTE 2/2 do dono: '10, ou
# 15 com ZRAM zstd ativo'): a régua E132/E135 (180/160/150 por perfil
# de RAM) morre pela ordem nova — o zram zstd fica (o pico de RAM vive
# comprimido em RAM), mas a página fria desce ao disco com mais respeito
# ao cache quente. O MESMO 15 mora no 99-elite-performance.conf — os
# DOIS donos do número falam UM número só (a lição E135 segue viva).
[zram0]
zram-size = min(ram, 8192)
compression-algorithm = zstd
swappiness = 15
