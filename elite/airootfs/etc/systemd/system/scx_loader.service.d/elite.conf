# ── ELITE (E136): a unit só existe onde o kernel a sustenta ───────────────
# sched_ext ausente (BORE sem SCX, kernel de outra casa) = a unit é
# PULADA no boot (Condition), não FAILED — o boot fica limpo e o
# escalonador é o BORE do kernel, sempre.
[Unit]
ConditionPathExists=/sys/kernel/sched_ext
