# Archcraft ELITE · drop-in do pacman-init (v2.9.1 — RETRY HONESTO)
#
# O QUE O UPSTREAM FAZ: oneshot SEM retry (pacman-key --init + --populate).
# O QUE O MUNDO MOSTROU: na build v2.9.1 o pacman-key morreu 1× no live do
# CI (exit 1 · 30s CPU · 91s wall) com a sessão perfeita em volta — a ISO
# era boa e o gate v1.5.2 (nenhuma unidade em failed) reprovou tudo por um
# tropeço transitório sob a carga do runner (verify + verify-install rodam
# QEMU em paralelo). O rerun do MESMO job na MESMA ISO decide flake ×
# determinístico; este drop-in é a cura da CLASSE para o futuro.
#
# A LEI: Restart=on-failure com 3 tentativas em 300s — flake transitório se
# cura sozinho no 2º/3º attempt (a unidade termina active e o gate segue
# valendo); keyring quebrado DE VERDADE falha as 3 e o gate v1.5.2 segue
# reprovando como sempre. Nada aqui mascara falha real — só dá fôlego ao
# oneshot que o upstream nasceu sem.
#
# Idempotente no instalado: o unpackfs copia este drop-in junto (o
# pacman-init é enabled no multi-user.target do upstream); --init e
# --populate são idempotentes e o E10 já popula no chroot do alvo.

[Unit]
StartLimitIntervalSec=300
StartLimitBurst=3

[Service]
Restart=on-failure
RestartSec=10
