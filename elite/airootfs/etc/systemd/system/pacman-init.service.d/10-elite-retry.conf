# Archcraft ELITE · drop-in do pacman-init (v2.9.1 — RETRY HONESTO)
#
# O QUE O UPSTREAM FAZ: oneshot SEM retry (pacman-key --init + --populate).
# O QUE O MUNDO MOSTROU: na build v2.9.1 o pacman-key morreu 1× no live do
# CI (exit 1 · 30s CPU · 91s wall) com a sessão perfeita em volta — a ISO
# era boa e o gate v1.5.2 (nenhuma unidade em failed) reprovou tudo por um
# tropeço transitório sob a carga do runner (verify + verify-install rodam
# QEMU em paralelo). O rerun do MESMO job na MESMA ISO decide flake ×
# determinístico; este drop-in é a cura da CLASSE para o futuro.
#
# A LEI (v2.9.1): Restart=on-failure com 3 tentativas — flake transitório
# se cura sozinho no 2º/3º attempt (a unidade termina active e o gate segue
# valendo); keyring quebrado DE VERDADE falha as 3 e o gate v1.5.2 segue
# reprovando como sempre. Nada aqui mascara falha real — só dá fôlego ao
# oneshot que o upstream nasceu sem.
#
# v2.10.16 · E29 — A CLASSE QUE A v2.9.1 NÃO VIU (run 41070218496): o
# daemon-reload da transação do keyring (elite-keyring-fix) REINICIOU o
# pacman-init (audit 1130 aos 456s) NO MEIO da transação — as 3 retries
# (RestartSec=10) colidiram TODAS com o lock do gnupg do scriptlet e
# morreram dentro da mesma janela de minutos. Duas curas:
#   1. ExecStartPre=craft-keyring-wait — o restart ESPERA (teto 240s)
#      qualquer pacman/pacman-key em voo; cai FORA da janela de colisão
#      em vez de queimar as vidas dentro dela. Sem máscara: teto esgota,
#      o pacman-key real julga e falha honesta continua honesta.
#   2. RestartSec 10→30 + janela 300→600s — vidas espaçadas sobrevivem a
#      um populate longo (2min24s CPU · 5min wall no serial da run).
#
# Idempotente no instalado: o unpackfs copia este drop-in junto (o
# pacman-init é enabled no multi-user.target do upstream); --init e
# --populate são idempotentes e o E10 já popula no chroot do alvo.

[Unit]
StartLimitIntervalSec=600
StartLimitBurst=3

[Service]
ExecStartPre=/usr/local/bin/craft-keyring-wait
Restart=on-failure
RestartSec=30
