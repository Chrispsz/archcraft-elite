# ── ELITE (E106/5b): os candidatos de sensor da casa no BOOT ────────────
# A diretriz da placa-mãe: os QUATRO candidatos da comunidade carregam
# no boot — Nuvoton (nct6775), ITE (it87) e os termômetros de CPU
# (k10temp=AMD, coretemp=Intel). O chip é da MÁQUINA: a sonda do
# elite-tune/firstboot (E138) e da DOSE (elite-post-upgrade E106/5b)
# REESCREVE este arquivo com quem PROVOU hwmon no /sys/class/hwmon —
# o candidato que sobe sem trazer sensor desce na hora, e o rig fica
# só com os chips que ESTA placa tem (zero módulo pedestre em boot).
# O CoolerControl/lm_sensors leem daqui as ventoinhas/temperaturas.
nct6775
it87
k10temp
coretemp
