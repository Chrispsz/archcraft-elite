# ── ELITE (E106/5b · E190): os candidatos de sensor da casa no BOOT ────
# A diretriz da placa-mãe carrega os candidatos da comunidade — mas
# E190 T1 o VENDOR decide o TERMOÔMETRO: o coretemp NUNCA carrega em
# CPU AMD e o k10temp NUNCA em Intel (o termômetro da casa certa é
# AUTOLOADADO pelo udev de fábrica; o elite-sensors.conf não convida
# o da casa errada). O chip Super I/O (Nuvoton nct6775, ITE it87) é
# da PLACA-MÃE, não do vendor — os dois seguem convidados sempre.
# A sonda do elite-tune/firstboot (E138) e da DOSE (elite-post-upgrade
# E106/5b) REESCREVE este arquivo com quem PROVOU hwmon no
# /sys/class/hwmon — o candidato que sobe sem trazer sensor desce na
# hora, e o rig fica só com os chips que ESTA placa tem (zero módulo
# pedestre em boot).
# O CoolerControl/lm_sensors leem daqui as ventoinhas/temperaturas.
nct6775
it87
