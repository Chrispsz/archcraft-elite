# ── ELITE (E138 → 1.0-101): os sensores de TEMPERATURA no boot ──────────
# O audit 99 fotografou coretemp e it87 FALHANDO no boot do rig AMD
# Ryzen (coretemp é Intel; it87 é o Super-I/O LEGADO que esta placa
# não tem — dois módulos nascendo mortos e duas linhas vermelhas no
# journal em todo coldplug). A casa AMD fica com o k10temp (o sensor
# oficial do Ryzen, SEMPRE presente). O firstboot REESCREVE este
# arquivo com os chips que ESTA máquina provou no /sys/class/hwmon —
# um rig Intel/líder de outro chip volta a ganhar os deles AQUI.
k10temp
