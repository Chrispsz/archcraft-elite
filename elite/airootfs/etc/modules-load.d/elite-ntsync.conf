# ── ELITE (E136 — a MISSÃO PARTE 2/2): ntsync no boot ─────────────────────
# O subsistema ntsync (drivers/ntsync do kernel mainline 6.14+) dá ao
# Proton/Wine moderno a sincronização NATIVA de processo — o esync/fsync
# (emulação por futex/futex2) era o overhead de toda partida. O módulo
# cria /dev/ntsync; a permissão 0666 vem da regra udev
# /etc/udev/rules.d/60-ntsync.rules. Kernel SEM o módulo: o
# systemd-modules-load registra o aviso e o boot SEGUE (nenhum serviço
# da casa depende do dispositivo — o Proton cai no futex de sempre).
ntsync
