# ── ELITE v2.10.26 (E38) — powersave de dispositivos: consumir SÓ quando necessário ──
# Audit E38: a ISO não tinha NENHUM knob de runtime powersave — o áudio
# e o Wi-Fi ficavam acordados para sempre. Estes dois são os defaults de
# fábrica do Fedora/Ubuntu há anos (trilha batida, risco baixo).
#
# Áudio HDA: o codec entra em D3 entre os sons (~0,5-1W em idle).
# Custo conhecido: pop ocasional em codec ruim no 1º som após o sono.
options snd_hda_intel power_save=1
#
# Wi-Fi Intel: powersave do firmware (iwlwifi). Latência sob carga sobe
# ~ms — o trade-off padrão de desktop/notebook moderno.
options iwlwifi power_save=1
