# ── ELITE v1.1: rede — BBR + fq ("internet rápida") ─────────────────────
# BBR modela banda×RTT em vez de loss (cubic): throughput real em links
# de alta latência/perda (fibra interurbana, Wi-Fi congestionado, VPN).
# O módulo tcp_bbr sobe via /etc/modules-load.d/elite-bbr.conf ANTES do
# systemd-sysctl (After=systemd-modules-load) — kernels com BBR =y fazem
# o modprobe virar no-op. Kernel sem bbr? O firstboot (elite-tune v4.6)
# remove estas linhas — nunca fica um sysctl morto reclamando no boot.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
