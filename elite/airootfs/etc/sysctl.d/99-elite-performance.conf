# ── ELITE: performance consolidado (E136 → E137) ───────────────────────────
# O ÚNICO sysctl da casa (nome do dono): /etc/sysctl.d/99-elite-performance.conf.
# O elite-tune (write_elite_sysctl — a lei única E37), o elite-optimize, o
# elite-post-upgrade e o elite-post-transaction regeneram/auditam ESTE nome.
#
# O SWAPPINESS = 180 (E137, PROMPT 3 do dono — recalibra a ordem E136): a
# casa TEM zram0 zstd 8G de fábrica e MGLRU ativos; com o swap inteiro em
# RAM comprimida, preferir anonymous pages agressivamente (escola
# SteamOS: 100–200) mantém o page cache hermético — descomprimir zram é
# barato, reler do disco é caro. QUEM GARANTE O NÚMERO NO BOOT: a regra
# udev 81-elite-zram.rules — o cachyos-settings escreve 150 no evento de
# nascimento do zram0 (DEPOIS do systemd-sysctl) e a 81 da casa reescreve
# 180 NO MESMO EVENTO, por ordem lexical (81 > 30). A vigília do
# elite-post-transaction re-aplica e CONFIRMA em cada dose (a rede sob o
# mecanismo).
vm.swappiness = 180
vm.vfs_cache_pressure = 50
vm.page_lock_unfairness = 1
vm.max_map_count = 2147483642
kernel.sched_autogroup_enabled = 1
# o trio do zram (cluster 0 = swap-in devolve 1 página; watermark_boost 0
# = fim dos stalls de reclaimer; scale 125 = kswapd acorda cedo o bastante)
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
# o par do dirty + a compactação proativa desligada
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10
vm.compaction_proactiveness = 0
# ── rede: BBR + fq ─────────────────────────────────────────────────────────
# O módulo tcp_bbr sobe via /etc/modules-load.d/elite-bbr.conf ANTES do
# systemd-sysctl. Kernel sem bbr? O firstboot (ensure_bbr, modo 'iso')
# REMOVE estas linhas — nunca fica um sysctl morto reclamando no boot.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
