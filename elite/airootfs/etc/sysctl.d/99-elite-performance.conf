# ── ELITE: performance consolidado (E136 — a MISSÃO PARTE 2/2 do dono) ────
# A CONSOLIDAÇÃO: os dois arquivos da era anterior (99-elite.conf da RAM
# + 99-elite-net.conf da rede) viram UM só — o dono nomeou o arquivo e a
# casa obedece: /etc/sysctl.d/99-elite-performance.conf. O elite-tune
# (write_elite_sysctl — a lei única E37), o elite-optimize, o
# elite-post-upgrade e o elite-post-transaction regeneram/auditam ESTE
# nome; os fósseis 99-elite.conf/99-elite-net.conf são removidos com voz
# na primeira dose (post_upgrade) — a ordem lexical nunca mais decide.
#
# O SWAPPINESS RECALIBRADO (a ordem nova do dono, PARTE 2/2: '10, ou 15
# com ZRAM zstd ativo'): a casa TEM zram0 zstd ativo de fábrica
# (zram-generator.conf viaja na ISO desde a E74) — o número da lei é 15.
# A régua E132/E135 (180/160/150 por perfil de RAM) MORRE pela ordem
# nova: o mesmo número em TODO perfil, no conf DA CASA e no
# zram-generator.conf (a opção do gerador é a última palavra no swapon —
# a lição E135 do drift 150≠180 segue valendo, agora com 15 nos DOIS).
vm.swappiness = 15
vm.vfs_cache_pressure = 50
vm.page_lock_unfairness = 1
vm.max_map_count = 2147483642
kernel.sched_autogroup_enabled = 1
# v2.10.26/E38 — o trio do zram (cluster 0 = swap-in devolve 1 página;
# watermark_boost 0 = fim dos stalls de reclaimer; scale 125 = kswapd
# acorda cedo o bastante)
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
# E132 — o par do dirty + a compactação proativa desligada
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10
vm.compaction_proactiveness = 0
# ── rede: BBR + fq (a antiga 99-elite-net.conf, agora consolidada) ────────
# O módulo tcp_bbr sobe via /etc/modules-load.d/elite-bbr.conf ANTES do
# systemd-sysctl. Kernel sem bbr? O firstboot (ensure_bbr, modo 'iso')
# REMOVE estas linhas — nunca fica um sysctl morto reclamando no boot.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
