# ── ELITE: sysctl de gaming (sobe por cima do cachyos-settings — /etc vence /usr/lib)
# Ideal COM zram ativo (zram-generator.conf acompanha esta ISO)
vm.swappiness = 180
vm.vfs_cache_pressure = 50
vm.page_lock_unfairness = 1
vm.max_map_count = 2147483642
kernel.sched_autogroup_enabled = 1
# v2.10.26/E38 — o trio do repositório SteamOS/Fedora que FALTAVA (a
# receita do zram era pela metade): cluster 0 = swap-in devolve 1 página
# (não 8 — leitura de swap 8× menor); watermark_boost 0 = fim dos stalls
# de reclaimer sob zram; scale 125 = kswapd acorda cedo o bastante.
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
