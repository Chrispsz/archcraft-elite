# ── ELITE: sysctl de gaming (sobe por cima do cachyos-settings — /etc vence /usr/lib)
# Ideal COM zram ativo (zram-generator.conf acompanha esta ISO)
vm.swappiness = 180
vm.vfs_cache_pressure = 50
vm.page_lock_unfairness = 1
vm.max_map_count = 2147483642
kernel.sched_autogroup_enabled = 1
# v2.10.26/E38 — o trio do repositório SteamOS/Fedora que FALTAVA (a
# receita do zram era pela metade): cluster 0 = swap-in devolve 1 página
# (não 8 — leitura de swap 8× menor); watermark_boost 0 = fim dos stalls
# de reclaimer sob zram; scale 125 = kswapd acorda cedo o bastante.
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
# E132 — o par do dirty + a compactação proativa desligada (a ordem do
# dono; o write_elite_sysctl do elite-tune REGENERA este arquivo com o
# swappiness CALIBRADO pela RAM real: <=8 GiB 180 · 16 GiB 160 · >=32
# GiB 150 — a ISO entrega o default da casa pequena, o firstboot e o
# post_upgrade calibram na máquina de verdade)
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10
vm.compaction_proactiveness = 0
