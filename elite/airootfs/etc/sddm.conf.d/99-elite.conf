# ═════════════════════════════════════════════════════════════════════════
# Archcraft ELITE · 99-elite.conf — A ESTABILIDADE TÉCNICA DO GREETER (1.0-108)
# ═════════════════════════════════════════════════════════════════════════
# AS TRÊS CHAVES DA DIRETRIZ (a perícia do rig 1.0-107.3: o journal do sddm
# com "Could not setup default cursor" e a sessão reciclada das dores de
# re-login pós-suspend) — UM DONO POR CHAVE (a lei da casa: o elite.conf
# veste o TEMA e a FONTE; este 99 veste o CHÃO):
#
#   · [General] InputMethod= VAZIO — o stub qtvirtualkeyboard da era
#     (teclado virtual que NUNCA existiu no disco do rig) fazia o greeter
#     chorar o agente ausente em TODO boot; a chave VAZIA desliga a busca.
#
#   · [Theme] CursorTheme=Adwaita — o cursor que SEMPRE existe no disco
#     (adwaita-icon-theme viaja na ISO): o "Could not setup default
#     cursor" morre com um tema REAL (o Bibata do desktop é o ponteiro da
#     sessão — o greeter veste o que a MÁQUINA garante).
#
#   · [Users] ReuseSession=false — o logout/login SEMPRE nasce uma sessão
#     Wayland LIMPA (nunca reaproveita o estado VT/PAM da sessão morta —
#     a sessão reciclada era o réu das dores do re-login pós-suspend).
# ═════════════════════════════════════════════════════════════════════════
[General]
InputMethod=

[Theme]
CursorTheme=Adwaita

[Users]
ReuseSession=false
