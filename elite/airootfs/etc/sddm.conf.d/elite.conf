# ═══════════════════════════════════════════════════════════════════════════
# Archcraft ELITE · elite.conf — o greeter VESTE a casa (E106/5b)
# ═══════════════════════════════════════════════════════════════════════════
# O journal do rig fotografou o sddm "Could not setup default cursor" com a
# tela de login cinza/azul EM INGLÊS ("Welcome!", "Login", "Suspend") — o
# tema do upstream nunca foi da casa. O tema `elite` (usr/share/sddm/
# themes/elite: Main.qml pt_BR na paleta obsidiana) veste o greeter, e o
# CursorTheme=Bibata é o cursor QUE A CASA ENTREGA (archcraft-cursor-bibata
# no packages.add — o mesmo ponteiro do desktop/labwc, do greeter ao fim):
# o "Could not setup default cursor" morre com um tema que EXISTE em disco.
# UM DONO POR CHAVE (a lei da casa): Current/CursorTheme moram AQUI — o
# kde_settings.conf perdeu as duas linhas (dois drop-ins brigando pela
# MESMA chave é o SDDM lendo só o último em ordem alfabética; o elite.conf
# vem antes e nunca venceria a briga).
#
# 1.0-107 — A ESTABILIDADE TÉCNICA DO GREETER (a tela de login segue com
# o visual e o fluxo NATIVOS de sempre — nada muda no rosto; só o chão):
#   · InputMethod= VAZIO — o stub qtvirtualkeyboard da era (teclado
#     virtual que NUNCA existiu no disco do rig) fazia o greeter chorar
#     o agente ausente em TODO boot; a chave VAZIA desliga a busca;
#   · ReuseSession=false — o logout/login SEMPRE nasce uma sessão
#     Wayland LIMPA (nunca reaproveita o estado VT/PAM da sessão morta
#     — a sessão reciclada era o réu das dores do re-login pós-suspend).
[General]
InputMethod=
ReuseSession=false

[Theme]
Current=elite
CursorTheme=Bibata
