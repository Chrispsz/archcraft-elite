[Autologin]
Relogin=false
Session=labwc
User=liveuser

[General]
HaltCommand=/usr/bin/systemctl poweroff
RebootCommand=/usr/bin/systemctl reboot

[Theme]
Current=archcraft
# BLOCO 4 — O ÚLTIMO SOTAQUE DO PONTEIRO MORRE: o greeter vestia Qogirr
# (a "face pública do SDDM" da era E36) enquanto a sessão inteira veste
# Bibata — cursor A na senha, cursor B no desktop. A paleta oficial
# unifica as telas; o cursor idem: Bibata do greeter ao desktop (o tema
# já viaja na ISO: archcraft-cursor-bibata; o Qogirr se aposenta com voz
# no packages.add).
CursorTheme=Bibata
#CursorSize=16
Font=Iosevka,10,-1,0,50,0,0,0,0,0
