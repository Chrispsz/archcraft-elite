[Autologin]
Relogin=false
Session=labwc
User=liveuser

[General]
HaltCommand=/usr/bin/systemctl poweroff
RebootCommand=/usr/bin/systemctl reboot

[Theme]
# E106/5b — O TEMA MUDOU DE DONO: o drop-in elite.conf é agora a ÚNICA
# casa das chaves Current/CursorTheme (o tema pt_BR `elite` + o cursor
# Bibata — um dono por chave; dois arquivos brigando pela MESMA chave
# é o SDDM lendo só um). Aqui ficam só as chaves que ninguém mais tem:
# a fonte do greeter é a mesma do lock (Iosevka).
Font=Iosevka,10,-1,0,50,0,0,0,0,0
