# ═══════════════════════════════════════════════════════════════════════════
# Archcraft ELITE · elite_wayland.conf — o greeter em WAYLAND NATIVO (E151)
# ═══════════════════════════════════════════════════════════════════════════
# A diretriz do debloat extremo: o Xorg OCIOSO atrás do greeter (~91 MB
# de RAM pagos por nada — o greeter é uma janela, não um servidor X)
# morre. O SDDM do Arch (sddm-git Qt6 ≥ 0.21) fala `DisplayServer=wayland`
# em [General] e sobe o compositor de [Wayland] — a casa usa O PRÓPRIO
# compositor da sessão (o labwc, que já viaja na ISO: zero pacote novo).
# Sintaxe canônica (sddm.conf.d):
#   [General] DisplayServer=wayland  → o daemon não lança o servidor X
#   [Wayland] CompositorCommand      → o compositor que veste o greeter
# O GREETER É CLIENTE: o SDDM lança o sddm-greeter conectado ao socket
# do compositor (o labwc do greeter lê os defaults dele — nada do skel
# do usuário, zero rice na tela de login).
# FALLBACK SEGURO (a lei da casa: nada de tela preta no login): o
# elite-post-upgrade só entrega ESTE arquivo quando /usr/bin/labwc
# existe; sem labwc ele remove o drop-in e o SDDM volta ao X11 de
# sempre. O xorg-server segue instalado nos RIGS existentes como rede
# de segurança — só a ISO para de nascer com ele (packages.add E151).
[General]
DisplayServer=wayland

[Wayland]
CompositorCommand=labwc
