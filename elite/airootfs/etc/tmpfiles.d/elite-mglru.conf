# ── ELITE (E136 — a MISSÃO PARTE 2/2): MGLRU ligado em TODO boot ──────────
# O Multi-Gen LRU (lru_gen) é o reclaim moderno do kernel: gerações de
# páginas em vez das duas listas ativa/inativa — menos stutter sob
# pressão de memória, o "desktop que engasga com o tempo" morre.
# enabled=7 = as três opções (motor lru_gen + refault dos file/anon);
# o CachyOS liga por padrão — este tmpfiles REAFIRMA em todo boot (o
# mesmo desenho do 99-elite-thp.conf da E132: barato e idempotente).
# Kernel sem MGLRU: o systemd-tmpfiles registra o caminho ausente e
# segue (nada trava, nada morre).
w /sys/kernel/mm/lru_gen/enabled - - - - 7
