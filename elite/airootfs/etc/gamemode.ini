; ═══════════════════════════════════════════════════════════════════════
; Archcraft ELITE · gamemode.ini — o MÚSCULO do modo de jogo (E103)
; ───────────────────────────────────────────────────────────────────────
; A diretriz do dono: "definir o performance no CPU quando entrar no jogo
; automaticamente". O gamemode do Feral é o MÚSCULO (sob D-Bus activation —
; RAM zero no idle): governor performance (EPP incluso no amd-pstate-epp),
# GPU amdgpu em high, screensaver inibido durante o jogo, rollback AUTOMÁTICO
; no fim (o reaper e o end-hook devolvem o perfil da casa — o contraponto
; funcional: tudo que o início sobe, o fim desce).
;
; O CÉREBRO (detecção, holder manual, menu, avisos -u low) é o craft-game.
;
; Referência: man gamemoded(8) / docs do upstream (FeralInteractive).
[general]
; frequência do reaper (s) — o daemon confere os pids registrados
reaper_freq=5
; O GOVERNOR DO JOGO (a diretriz do dono): performance no CPU ao entrar
desiredgov=performance
; soft realtime BORE-friendly (auto = só se o kernel der suporte)
softrealtime=auto
; renice 0: o BORE + ananicy-cpp da casa já mandam no scheduling — nice
; extra lutaria com as regras CachyOS (a lição v2.2 da leveza radical)
renice=0
; i/o de jogo na classe do desktop (o zstd/btrfs da casa agradece)
ioprio=0
; o lock da casa (craft-lock/vigil) manda na tela — o gamemode não precisa
; disputar o screensaver, mas jogos exigem o inibidor nativo:
inhibit_screensaver=1

[gpu]
; GPU AMD/Navi (o rig da casa): power_dpm_force_performance_level=high
; accept-residual = aplica onde reconhece, ignora o que não é AMD sem
; falhar (a ISO também nasce em Intel/NVIDIA)
apply_gpu_optimisations=accept-residual
amd_performance_level=high

[custom]
; OS HOOKS DA CASA (início/fim do modo): o aviso -u low + o papel do jogo.
; Pop-up flutuante NÃO é lugar de estado (lei E103) — a central guarda.
start=/usr/local/bin/craft-game hook start
end=/usr/local/bin/craft-game hook end
