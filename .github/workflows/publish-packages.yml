# ═══════════════════════════════════════════════════════════════════════════
# Canal testing [elite-local] — builds contínuos de VALIDAÇÃO
# ───────────────────────────────────────────────────────────────────────────
# 1.0-107.1 — A SEPARAÇÃO TESTING × STABLE (a diretriz do ciclo
# intermediário): o push de casa gera o build de VALIDAÇÃO na prerelease
# `testing` (NUNCA na release estável — o rig só recebe o que o dono
# PROMOVEU depois de provar no hardware real, pelo workflow de
# promoção; a ISO de tag continua sendo o retrato estável). A prerelease
# rola ÚNICA (uma só `testing` viva) com dieta automática de assets: o
# build antigo de teste é substituído no ar, nunca acumulado.
#
#   push no main (código de casa) → guarda da lei E41 → makepkg dos pacotes
#   da casa (PACKAGES_ONLY, minutos — sem ISO) → repo-add contra o db do
#   prerelease testing → upload --clobber (a promoção leva ao rig).
#   E50 — O CANAL PUBLICA A ERA NOVA: elite-system (O PACOTE ÚNICO). O
#   elite-craft PAROU de ser publicado (a era dos dois veículos encerrou;
#   o último 1.0-6 segue no db como fóssil — os rigs que o têm são
#   substituídos pelo replaces do elite-system).
#   E51.1 — A PONTE VOLTA (o erro confessado): retirá-la do db cortou a
#   ÚNICA porta automática dos rigs v2 (craft-update sem alvos — a ISO 28
#   inteira). Ela permanece publicada até a última era-v2 se extinguir.
#
# A RELEASE ESTÁVEL NUNCA é tocada aqui: ISO/sha256sums/JUNTAR-ISO/body
# da release de tag seguem intocados — só a prerelease testing carrega
# elite-local.db, os .pkg.tar.zst da casa e o selo sha256sums-pacotes.txt.
# A promoção a estável é o workflow dedicado (gatilho humano, depois da
# prova no hardware real). (E43 → 1.0-107.1)
name: Canal testing [elite-local]

on:
  push:
    # E103.1 — A PORTEIRA HONESTA: o filtro nasceu podre (a E43 escreveu
    # "branches: ain" + o colchete se perdeu na escrita) e o GitHub CALOU
    # (schema leniente: filtro invalido = ignora e dispara em qualquer
    # branch com os paths da casa). A intencao sempre foi MAIN — agora o
    # filtro DIZ o que faz (push no main dispara o canal; a suite CONTRATA
    # a linha abaixo — o filtro nao enferruja de novo).
    branches: [main]
    paths:
      - 'elite/airootfs/usr/local/bin/**'
      - 'vendor/**'
      # E-auditoria 2026-11-24 (a cura do buraco da auditoria das 16:00):
      # o fio Rust é conteúdo do ÚNICO (lei E143-corrige — crates/** no
      # delta do elite-system, pkgrel sobe com Rust), mas o Canal estava
      # CEGO a crates/: o push d2163b1 (E143-corrige2, 4 arquivos Rust)
      # não gerou run NENHUMA — a cura do Canal 141 ficou sem revalidação
      # e o Gate do push ficou só no cargo test local (--no-default-
      # features, que NUNCA compila o corpo da gui — a classe exata que
      # só o Canal pega). Agora o Canal enxerga crates/ e re-valida a GUI
      # compilada em cada push do fio.
      - 'crates/**'
      - '.ci/build.sh'
      - '.ci/guard-pkgrel.sh'
      - '.github/workflows/publish-packages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canal-diario-elite-local
  cancel-in-progress: true

jobs:
  pacotes:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0            # a lei E41 compara contra a última tag
          persist-credentials: false

      - name: Marco T0 (o relógio das etapas do resumo)
        run: echo "TS_T0=$(date +%s)" >> "$GITHUB_ENV"

      - name: Lei E41 — conteúdo de casa mudou ⇒ pkgrel sobe (guard executável)
        run: bash .ci/guard-pkgrel.sh

      # FASE 2 — O GUARDA DO MODO (o bit 0755 VIAJA NO GIT: o checkout da
      # suíte e o cp -a do package() herdam o index — a classe 'craft-apps
      # sem +x no rig' nasce em push que derruba o bit, ex.: conteúdo
      # escrito por API). O Canal recoloca o bit da casa ANTES de
      # empacotar e devolve o commit ao main — a suíte 50-runtime-ipc
      # julga o index, o pacman entrega o modo certo.
      - name: Guarda do modo 0755 (o bit é conteúdo — recoloca e volta)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          chmod 755 elite/airootfs/usr/local/bin/* 2>/dev/null || true
          chmod 755 scripts/*.sh 2>/dev/null || true
          if ! git diff --quiet; then
            git add elite/airootfs/usr/local/bin scripts
            git commit -m "guarda-do-modo: o bit 0755 da casa recolocado (push externo derrubou o modo via API — a lei: bins/scripts da casa nascem 0755 no git, o cp -a do package carrega)"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:main
            echo "── modo recolocado e commitado (a próxima tests.yml julga o index corrigido)"
          else
            echo "── modos da casa íntegros (nada a recolocar)"
          fi

      # 1.0-93 — O CACHE CARGO (a ordem do dono: o target do workspace
      # persiste entre runs — as deps do workspace pagam o compile 1x; a
      # chave é o Cargo.lock, mudou a dependência = cache novo)
      # FASE 2 — A CHAVE UNIFICADA (o diagnóstico da Fase 2: a suíte e o
      # Canal carregavam DOIS caches gêmeos que nunca se falavam —
      # cargo-target-* vs canal-cargo-target-* = o compile das deps pago
      # DUAS vezes a cada push de fio. Uma chave só: quem compila primeiro
      # alimenta o outro pelo restore-key).
      - name: Cache do Cargo (crates/target — o build das deps paga 1x)
        uses: actions/cache@v4
        with:
          path: crates/target
          key: cargo-target-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: |
            cargo-target-

      - name: Marco do build (início)
        run: echo "TS_BUILD_INICIO=$(date +%s)" >> "$GITHUB_ENV"

      - name: Construir os pacotes da casa (container Arch privilegiado)
        run: |
          set -o pipefail
          # o modo PACKAGES_ONLY de .ci/build.sh: makepkg de elite-system
          # e SAÍDA — nenhuma ISO, nenhum pacstrap, minutos (o elite-craft
          # parou na E50; o craft-toplevel parou na 2.0 Fase 2 — o C de 3
          # gerações morreu, o cliente Wayland é o próprio elite-daemon).

          docker run --rm \
            -v "$PWD":/work \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -e PACKAGES_ONLY=1 \
            -w /work \
            archlinux:base-devel \
            bash .ci/build.sh 2>&1 | tee pacotes-output.log

      # ── FASE 2 — O SMOKE DE RUNTIME (o portão antes do db) ──────────────
      # A ordem nova: pacote parido → SESSÃO BOOTED → só então repo-add/
      # upload. O pacote sobe num labwc headless DENTRO do container (a
      # gui já compilada com o gtk4 do makepkg): bus.sock VIVO, 2ª
      # instância sai 0 com papel, barra+dock de pé SEM Gtk-WARNING nem
      # "still has children" nem \uXXXX, craft-game/craft-idle respondendo
      # e o --help dos 8 compilados (E90 executiva). Contrato quebrado =
      # run vermelha = NADA sobe para o rig (a classe 'dose cega no rig'
      # morre na origem). Compositor que não sobe NO CONTAINER = SKIP
      # honesto nomeado (o juízo de ambiente, nunca um verde de cortesia).
      - name: Marco do build (fim) + smoke (início)
        run: echo "TS_BUILD_FIM=$(date +%s)" >> "$GITHUB_ENV"

      - name: Smoke de runtime sobre o pacote (labwc headless — o portão do db)
        run: |
          set -o pipefail
          # --privileged é o regime do compositor (a 1ª corrida provou: sem
          # privilégio o exec do labwc morre 'Operation not permitted' e o
          # smoke faz o SKIP honesto — o portão só fecha DE VERDADE com o
          # mesmo regime do build da ISO; a contraprova fica no log da run
          # 45586913853, passo do smoke)
          docker run --rm --privileged \
            -v "$PWD":/work \
            -w /work \
            archlinux:base-devel \
            bash tests/ci-runtime-smoke.sh 2>&1 | tee smoke-runtime.log

      - name: Marco do smoke (fim) + publicação (início)
        run: echo "TS_SMOKE_FIM=$(date +%s)" >> "$GITHUB_ENV"

      - name: Publicar na prerelease testing → repo-add → upload --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm \
            -v "$PWD":/work -w /work \
            -e GH_TOKEN="$GH_TOKEN" \
            -e REPO="$GITHUB_REPOSITORY" \
            archlinux:base-devel \
            bash -euc '
              pacman -Syu --noconfirm --needed github-cli >/dev/null 2>&1
              TAG="testing"
              if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
                echo "prerelease de validação: $TAG (a rola ÚNICA de teste — a stable NÃO é tocada)"
              else
                echo "── a prerelease testing NASCE (a primeira publicação do canal)"
                gh release create "$TAG" --repo "$REPO" --prerelease --latest=false \
                  --title "Canal Testing — elite-local" \
                  --notes "Builds contínuos de VALIDAÇÃO do canal [elite-local]. A release ESTÁVEL é a de tag (releases/latest) — o que chega ao rig é SÓ o que o dono promoveu depois de validar no hardware real. Dieta automática: só a build mais recente de cada pacote fica no ar."
              fi
              mkdir -p /tmp/repo && cd /tmp/repo
              # o db ATUAL da prerelease é a base: repo-add ADICIONA as
              # entradas novas — os demais pacotes (brave-origin 186MB,
              # pwvucontrol, …) NEM são baixados. Ausente = db nasce vazio.
              gh release download "$TAG" --repo "$REPO" --pattern "elite-local.db.tar.gz" || echo "── db ausente: a prerelease nasce com db NOVO"
              # E103 — OS ÓRFÃOS DO DB-BASE (a era pré-E101 publicou -debug
              # que nunca embarcou: pwvucontrol-debug/wlrctl-debug no db e
              # 404 no rig — a prova do papel, 10/nov). A entrada órfã sai
              # do db ANTES do repo-add: o rig novo não herda o fantasma
              # (o cinto case *-debug da dose cobre quem já sincronizou o
              # db doente).
              mkdir -p db-prune && tar -xzf elite-local.db.tar.gz -C db-prune
              for d in db-prune/*-debug-*/; do
                [ -d "$d" ] || continue
                echo "── db-base: órfão fora do ar: ${d#db-prune/}"
                rm -rf "$d"
              done
              tar -czf elite-local.db.tar.gz -C db-prune $(ls db-prune)
              rm -rf db-prune
              cp /work/out/pacotes/elite-system-*.pkg.tar.zst .
              # E114 — O BRAVE NO CANAL (o buraco nomeado pela E113: o canal
              # publicava SÓ elite-system (+ a ponte) e o rig ficava em
              # 1.99.55 com o pin da casa em 1.99.57 — o navegador do rig
              # era defasado PERMANENTE e o check-brave celebrava o pin
              # enquanto o rig ficava para trás). O pacote da casa já existe
              # como ASSET da release viva (o build completo o pariu):
              # baixa → repo-add → o craft-update -Sy do rig entrega o pin.
              # ZERO rebuild aqui, ZERO upload de 186 MB por push — o db é
              # o único veículo novo. Ausente na release = o canal segue
              # sem ele, com o réu nomeado no log da run.
              # E114.2 — A ORDEM DA VERDADE: o pin PARIDO nesta run vence
              # (o estágio do build.sh parte o BRAVE_PIN atual no fluxo do
              # canal); o asset da release viva é o plano B (o estágio da
              # era do último build completo — pode estar no pin velho);
              # nenhum dos dois = o canal segue sem ele, réu nomeado.
              if ls /work/out/pacotes/brave-origin-*.pkg.tar.zst >/dev/null 2>&1; then
                cp /work/out/pacotes/brave-origin-*.pkg.tar.zst .
                echo "── brave DO PIN recém-parido entra no db:"
                ls -lh brave-origin-*.pkg.tar.zst
                BRAVE_NO_CANAL=1
              elif gh release download "$TAG" --repo "$REPO" --pattern "brave-origin-*.pkg.tar.zst" --clobber; then
                echo "── brave do ASSET da release viva entra no db (o pin parido não veio nesta run):"
                ls -lh brave-origin-*.pkg.tar.zst
                BRAVE_NO_CANAL=1
              else
                echo "── SEM brave-origin (nem parido, nem asset) — o canal segue sem ele (réu nomeado no log da run)"
                BRAVE_NO_CANAL=""
              fi
              # E103 — O DB ADVERSA SÓ O QUE EMBARCA (a prova do dono no
              # papel, 10/nov: pwvucontrol-debug/wlrctl-debug no repo-add
              # e 404 no download do rig — o pacman RECUSOU a dose INTEIRA
              # por uma peça que não existe na release). A lei nova: o db
              # recebe EXATAMENTE o conjunto que sobe; -debug e amigos que
              # o makepkg gerar ficam FORA (o rig de produção nunca os
              # pede — artefato de desenvolvimento).
              PKGARGS="elite-system-*.pkg.tar.zst"
              [ -n "$BRAVE_NO_CANAL" ] && PKGARGS="$PKGARGS brave-origin-*.pkg.tar.zst"
              repo-add --quiet elite-local.db.tar.gz $PKGARGS
              # pacman consulta <repo>.db SEM sufixo (E32) — arquivo real, não symlink
              rm -f elite-local.db && cp elite-local.db.tar.gz elite-local.db
              # E114 — O SELO COBRE EXATAMENTE O QUE O DB ADVERSA (o selo da
              # era anterior não sabia do brave): regenerado aqui sobre o
              # conjunto real; sem brave, o selo do makepkg segue valendo.
              if [ -n "$BRAVE_NO_CANAL" ]; then
                sha256sum elite-system-*.pkg.tar.zst brave-origin-*.pkg.tar.zst > sha256sums-pacotes.txt
              else
                cp /work/out/pacotes/sha256sums-pacotes.txt .
              fi
              echo "── selo da run:"
              cat sha256sums-pacotes.txt
              gh release upload "$TAG" elite-local.db elite-local.db.tar.gz \
                elite-system-*.pkg.tar.zst \
                sha256sums-pacotes.txt \
                --repo "$REPO" --clobber
              # E114.2 — O ASSET DO BRAVE SOBE SEMPRE QUE O DB O ADVERSA (a
              # 1ª tentativa com skip-por-sha morreu no próprio papel: o selo
              # comparado era o que a run ACABAVA de subir, e o builddate do
              # makepkg muda os bytes a cada build — o db é a autoridade do
              # sha que o pacman cobra: o asset tem que ser O BYTE desta
              # build). O store abaixo mantém uma versão só no ar.
              if [ -n "$BRAVE_NO_CANAL" ]; then
                nm_brave="$(basename brave-origin-*.pkg.tar.zst)"
                echo "── brave $nm_brave: sobe com --clobber (o db cobra O byte desta build)"
                gh release upload "$TAG" "$nm_brave" --repo "$REPO" --clobber
              fi
              # E101 — A LOJA SEM PILHA (o dono: "cheio de assets sujos"):
              # o --clobber sobrepõe o NOME igual, mas cada pkgrel é um nome
              # NOVO — 44 versões do elite-system lotaram a release viva
              # (4,9 GB de assets, 73 arquivos). Publicada a versão de
              # hoje, toda OUTRA versão do MESMO pacote sai do ar: o rig só
              # quer a última, o fóssil não é produto.
              # E101.1 — ZERO ASPAS SIMPLES no corpo (o script inteiro vive
              # DENTRO de bash -euc "...": aspa simples TERMINA a string e
              # o resto morre como argumento solto — a run #63 provou: o
              # upload rodou, a dieta virou poeira e o step ficou VERDE.
              # O veneno era silencioso; agora é lei do papel).
              for nm in elite-system brave-origin; do
                  # E114 — o brave mora no CWD (baixado do asset), os outros
                  # dois em /work/out/pacotes: a busca cobre os dois endereços
                  keep="$(ls /work/out/pacotes/${nm}-*.pkg.tar.zst ./${nm}-*.pkg.tar.zst 2>/dev/null | head -1 | xargs -r -n1 basename)"
                  [ -n "$keep" ] || continue
                  gh release view "$TAG" --repo "$REPO" --json assets --jq ".assets[].name" \
                    | grep -E "^${nm}-.*\.pkg\.tar\.zst$" | grep -vxF "$keep" \
                    | while read -r old; do
                        echo "── loja limpa: $old fora do ar (a viva é $keep)"
                        gh release delete-asset "$TAG" "$old" --repo "$REPO" --yes || true
                      done
              done
              echo "── assets de PACOTE da release viva após a run:"
              gh release view "$TAG" --repo "$REPO" --json assets --jq ".assets[].name" \
                | grep -E "elite-system|brave-origin|elite-local\.db|sha256sums-pacotes" || true
              # E103 — A VERIFICAÇÃO DO CANAL: CADA arquivo no db precisa
              # ter asset na release viva (a classe 404 é impossível — o
              # canal se prova antes de o rig pagar a recusa). O
              # %FILENAME% do db é a FONTE DA VERDADE — a reconstrução
              # nome-versão-arch mentia para as peças -any (o réu da run
              # #66 da linha divergida: 4 assets sadios reprovados por
              # hardcode -x86_64).
              echo "── verificação db↔assets:"
              fail=0
              verify_dir="$(mktemp -d)"
              tar -xzf elite-local.db.tar.gz -C "$verify_dir"
              for d in "$verify_dir"/*/; do
                [ -f "$d/desc" ] || continue
                arq="$(awk "/%FILENAME%/{getline; print; exit}" "$d/desc")"
                [ -n "$arq" ] || continue
                if gh release view "$TAG" --repo "$REPO" --json assets \
                     --jq ".assets[].name" | grep -qx "$arq"; then
                  echo "  ok: $arq"
                else
                  echo "FALTOU: $arq — asset ausente para uma entrada do db" >&2
                  fail=1
                fi
              done
              rm -rf "$verify_dir"
              if [ "$fail" -eq 1 ]; then
                echo "ERRO: o db ficou ADIANTE da release — a run é VERMELHA (o rig nunca deve ver 404)" >&2
                exit 1
              fi
              echo "── prontos: a build de validação está na prerelease testing."
            '''

      - name: Resumo técnico do canal ($GITHUB_STEP_SUMMARY)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pkgrel="$(grep -B2 "pkgdesc='O sistema da Elite" .ci/build.sh | grep -oE 'pkgrel=[0-9.]+' | head -1 | cut -d= -f2)"
          dur() { _a="${1}"; _b="${2}"; [ -n "$_a" ] && [ -n "$_b" ] && echo "$(( _b - _a ))s" || echo "—"; }
          gh_out="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/testing" --jq '[.assets[] | [.name, (.size|tostring)] | @tsv] | .[]' 2>/dev/null || true)"
          {
            echo "## Canal testing [elite-local] — build de validação"
            echo
            echo "| campo | valor |"
            echo "|---|---|"
            echo "| canal | testing (prerelease — a stable segue em releases/latest) |"
            echo "| versão (elite-system pkgrel) | ${pkgrel:-?} |"
            echo "| commit | \`${GITHUB_SHA:0:10}\` |"
            echo "| duração · guarda E41 + modo | $(dur "$TS_T0" "$TS_BUILD_INICIO") |"
            echo "| duração · makepkg (elite-system + brave) | $(dur "$TS_BUILD_INICIO" "$TS_BUILD_FIM") |"
            echo "| duração · smoke de runtime | $(dur "$TS_BUILD_FIM" "$TS_SMOKE_FIM") |"
            echo
            echo "### Assets da prerelease testing"
            echo
            echo "| asset | tamanho |"
            echo "|---|---|"
            if [ -n "$gh_out" ]; then
              while IFS=$'\t' read -r nome tamanho; do
                mb=$(( tamanho / 1048576 ))
                echo "| $nome | ${mb} MiB |"
              done <<< "$gh_out"
            else
              echo "| (sem assets — primeira publicação) | — |"
            fi
            echo
            echo "O selo \`sha256sums-pacotes.txt\` da prerelease é a prova byte a byte da build."
            echo "Promoção a estável: workflow **Promover testing → stable** (gatilho manual, após a validação no hardware real)."
          } >> "$GITHUB_STEP_SUMMARY"
