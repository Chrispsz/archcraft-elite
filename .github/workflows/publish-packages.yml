# ═══════════════════════════════════════════════════════════════════════════
# Canal diário [elite-local] — commits de casa chegam como ATUALIZAÇÃO
# ───────────────────────────────────────────────────────────────────────────
# A demanda do dono (04/nov): "antes mesmo da iso sair esses commits já
# devem sair como atualização… evitar ficar formatando e reinstalando a
# cada update". A ISO fica sendo o retrato ESTÁVEL (mensal); a evolução
# diária viaja pelo pacman:
#
#   push no main (código de casa) → guarda da lei E41 → makepkg dos pacotes
#   da casa (PACKAGES_ONLY, minutos — sem ISO) → repo-add contra o db do
#   release vivo → upload --clobber → o craft-update do rig (-Syu) entrega.
#   E50 — O CANAL PUBLICA A ERA NOVA: elite-system (O PACOTE ÚNICO). O
#   elite-craft PAROU de ser publicado (a era dos dois veículos encerrou;
#   o último 1.0-6 segue no db como fóssil — os rigs que o têm são
#   substituídos pelo replaces do elite-system).
#   E51.1 — A PONTE VOLTA (o erro confessado): retirá-la do db cortou a
#   ÚNICA porta automática dos rigs v2 (craft-update sem alvos — a ISO 28
#   inteira). Ela permanece publicada até a última era-v2 se extinguir.
#
# A LEI DA RELEASE ÚNICA VIVA fica intacta: NENHUMA release é criada/apagada;
# os assets de ISO/sha256sums/JUNTAR-ISO/body da release viva NUNCA são
# tocados aqui — só elite-local.db, os .pkg.tar.zst da casa e o selo
# sha256sums-pacotes.txt. (E43)
name: Canal diário [elite-local]

on:
  push:
    branches: [main]
    paths:
      - 'elite/airootfs/usr/local/bin/**'
      - 'vendor/**'
      - '.ci/build.sh'
      - '.ci/guard-pkgrel.sh'
      - '.github/workflows/publish-packages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canal-diario-elite-local
  cancel-in-progress: true

jobs:
  pacotes:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0            # a lei E41 compara contra a última tag
          persist-credentials: false

      - name: Lei E41 — conteúdo de casa mudou ⇒ pkgrel sobe (guard executável)
        run: bash .ci/guard-pkgrel.sh

      - name: Construir os pacotes da casa (container Arch privilegiado)
        run: |
          set -o pipefail
          # o modo PACKAGES_ONLY de .ci/build.sh: makepkg de craft-toplevel +
          # elite-craft e SAÍDA — nenhuma ISO, nenhum pacstrap, minutos.
          docker run --rm \
            -v "$PWD":/work \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -e PACKAGES_ONLY=1 \
            -w /work \
            archlinux:base-devel \
            bash .ci/build.sh 2>&1 | tee pacotes-output.log

      - name: Repo completo do release vivo → repo-add → upload --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm \
            -v "$PWD":/work -w /work \
            -e GH_TOKEN="$GH_TOKEN" \
            -e REPO="$GITHUB_REPOSITORY" \
            archlinux:base-devel \
            bash -euc '
              pacman -Syu --noconfirm --needed github-cli >/dev/null 2>&1
              TAG="$(gh api "repos/$REPO/releases/latest" --jq .tag_name)"
              echo "release viva: $TAG (a Lei mantém só uma — nada é criada aqui)"
              mkdir -p /tmp/repo && cd /tmp/repo
              # o db ATUAL da release viva é a base: repo-add ADICIONA as
              # entradas novas — os demais pacotes (brave-origin 186MB,
              # pwvucontrol, …) NEM são baixados.
              gh release download "$TAG" --repo "$REPO" --pattern "elite-local.db.tar.gz"
              # E103 — OS ÓRFÃOS DO DB-BASE (a era pré-E101 publicou -debug
              # que nunca embarcou: pwvucontrol-debug/wlrctl-debug no db e
              # 404 no rig — a prova do papel, 10/nov). A entrada órfã sai
              # do db ANTES do repo-add: o rig novo não herda o fantasma
              # (o cinto case *-debug da dose cobre quem já sincronizou o
              # db doente).
              mkdir -p db-prune && tar -xzf elite-local.db.tar.gz -C db-prune
              for d in db-prune/*-debug-*/; do
                [ -d "$d" ] || continue
                echo "── db-base: órfão fora do ar: ${d#db-prune/}"
                rm -rf "$d"
              done
              tar -czf elite-local.db.tar.gz -C db-prune $(ls db-prune)
              rm -rf db-prune
              cp /work/out/pacotes/craft-toplevel-*.pkg.tar.zst .
              cp /work/out/pacotes/elite-system-*.pkg.tar.zst .
              # E103 — O DB ADVERSA SÓ O QUE EMBARCA (a prova do dono no
              # papel, 10/nov: pwvucontrol-debug/wlrctl-debug no repo-add
              # e 404 no download do rig — o pacman RECUSOU a dose INTEIRA
              # por uma peça que não existe na release). A lei nova: o db
              # recebe EXATAMENTE o conjunto que sobe; -debug e amigos que
              # o makepkg gerar ficam FORA (o rig de produção nunca os
              # pede — artefato de desenvolvimento).
              repo-add --quiet elite-local.db.tar.gz craft-toplevel-*.pkg.tar.zst elite-system-*.pkg.tar.zst
              # pacman consulta <repo>.db SEM sufixo (E32) — arquivo real, não symlink
              rm -f elite-local.db && cp elite-local.db.tar.gz elite-local.db
              cp /work/out/pacotes/sha256sums-pacotes.txt .
              echo "── selo da run:"
              cat sha256sums-pacotes.txt
              gh release upload "$TAG" elite-local.db elite-local.db.tar.gz \
                craft-toplevel-*.pkg.tar.zst \
                elite-system-*.pkg.tar.zst \
                sha256sums-pacotes.txt \
                --repo "$REPO" --clobber
              # E101 — A LOJA SEM PILHA (o dono: "cheio de assets sujos"):
              # o --clobber sobrepõe o NOME igual, mas cada pkgrel é um nome
              # NOVO — 44 versões do elite-system lotaram a release viva
              # (4,9 GB de assets, 73 arquivos). Publicada a versão de
              # hoje, toda OUTRA versão do MESMO pacote sai do ar: o rig só
              # quer a última, o fóssil não é produto.
              # E101.1 — ZERO ASPAS SIMPLES no corpo (o script inteiro vive
              # DENTRO de bash -euc "...": aspa simples TERMINA a string e
              # o resto morre como argumento solto — a run #63 provou: o
              # upload rodou, a dieta virou poeira e o step ficou VERDE.
              # O veneno era silencioso; agora é lei do papel).
              for nm in elite-system craft-toplevel; do
                  keep="$(ls /work/out/pacotes/${nm}-*.pkg.tar.zst 2>/dev/null | head -1 | xargs -r -n1 basename)"
                  [ -n "$keep" ] || continue
                  gh release view "$TAG" --repo "$REPO" --json assets --jq ".assets[].name" \
                    | grep -E "^${nm}-.*\.pkg\.tar\.zst$" | grep -vxF "$keep" \
                    | while read -r old; do
                        echo "── loja limpa: $old fora do ar (a viva é $keep)"
                        gh release delete-asset "$TAG" "$old" --repo "$REPO" --yes || true
                      done
              done
              echo "── assets de PACOTE da release viva após a run:"
              gh release view "$TAG" --repo "$REPO" --json assets --jq ".assets[].name" \
                | grep -E "elite-system|craft-toplevel|elite-local\.db|sha256sums-pacotes" || true
              # E103 — A VERIFICAÇÃO DO CANAL: CADA arquivo no db precisa
              # ter asset na release viva (a classe 404 é impossível — o
              # canal se prova antes de o rig pagar a recusa). O
              # %FILENAME% do db é a FONTE DA VERDADE — a reconstrução
              # nome-versão-arch mentia para as peças -any (o réu da run
              # #66 da linha divergida: 4 assets sadios reprovados por
              # hardcode -x86_64).
              echo "── verificação db↔assets:"
              fail=0
              verify_dir="$(mktemp -d)"
              tar -xzf elite-local.db.tar.gz -C "$verify_dir"
              for d in "$verify_dir"/*/; do
                [ -f "$d/desc" ] || continue
                arq="$(awk "/%FILENAME%/{getline; print; exit}" "$d/desc")"
                [ -n "$arq" ] || continue
                if gh release view "$TAG" --repo "$REPO" --json assets \
                     --jq ".assets[].name" | grep -qx "$arq"; then
                  echo "  ok: $arq"
                else
                  echo "FALTOU: $arq — asset ausente para uma entrada do db" >&2
                  fail=1
                fi
              done
              rm -rf "$verify_dir"
              if [ "$fail" -eq 1 ]; then
                echo "ERRO: o db ficou ADIANTE da release — a run é VERMELHA (o rig nunca deve ver 404)" >&2
                exit 1
              fi
              echo "── prontos: o craft-update do rig entrega no próximo -Syu."
            '
