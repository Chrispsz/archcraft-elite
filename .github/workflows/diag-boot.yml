name: Diag Boot (QEMU)

# Diagnóstico: boota a ISO de uma release em QEMU (TCG) com console serial,
# capturando cada linha do boot até "Startup finished" ou o ponto de travamento.
# Uso: Actions → Diag Boot (QEMU) → Run workflow (tag da release).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (ex: v1.0.2)'
        required: true
        default: 'v1.0.2'
        type: string

permissions:
  contents: read

jobs:
  qemu-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Instalar QEMU + 7zip
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 p7zip-full >/dev/null
          qemu-system-x86_64 --version | head -1
          7z i >/dev/null && echo "7z ok"

      - name: Baixar release, juntar e verificar sha256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.part-*' --pattern 'sha256sums.txt' --clobber
          cat archcraft-elite-*.iso.part-* > elite.iso
          ls -la elite.iso
          grep ' archcraft-elite-.*\.iso$' sha256sums.txt | sed 's/archcraft-elite-[^ ]*\.iso/elite.iso/' > check.txt
          cat check.txt
          sha256sum -c check.txt

      - name: Extrair boot files + configs de boot da ISO
        run: |
          7z l elite.iso | grep -iE '\.cfg|boot/x86_64' || true
          7z x -y elite.iso -oiso/ 'boot/grub/*' 'arch/boot/x86_64/*' >/dev/null
          echo "=== grub.cfg (kernel entries) ==="
          grep -E 'menuentry "|linux /|initrd /' iso/boot/grub/grub.cfg | head -30 || true
          echo "=== loopback.cfg (kernel entries) ==="
          grep -E 'menuentry "|linux /|initrd /' iso/boot/grub/loopback.cfg | head -30 || true
          ls -la iso/arch/boot/x86_64/

      - name: Boot test em QEMU (BORE default + stock nvidia)
        run: |
          set +e
          UUID=$(grep -o 'archisosearchuuid=[^ ]*' iso/boot/grub/grub.cfg | head -1 | cut -d= -f2)
          echo "ARCHISO_UUID=$UUID"
          COMMON="archisobasedir=arch archisosearchuuid=$UUID loglevel=7 udev.log_level=3 vt.global_cursor_default=0 cow_spacesize=5G copytoram=n nvme_load=yes lsm=landlock,lockdown,yama,integrity,apparmor,bpf console=ttyS0,115200 systemd.log_target=console systemd.log_level=info systemd.show_status=yes"

          boot_test() {
            NAME="$1"; KVER="$2"; IIMG="$3"; EXTRA="$4"
            LOG="serial-$NAME.log"
            echo "════════ [$NAME] kernel=$KVER initrd=$IIMG ════════"
            qemu-system-x86_64 \
              -machine q35 -cpu max -smp 4 -m 7168 \
              -kernel "iso/arch/boot/x86_64/$KVER" \
              -initrd "iso/arch/boot/x86_64/$IIMG" \
              -append "$COMMON $EXTRA" \
              -cdrom "$PWD/elite.iso" \
              -nographic -no-reboot -nic user \
              > "$LOG" 2>&1 &
            Q=$!
            DONE=0
            for i in $(seq 1 240); do
              if grep -q 'Startup finished' "$LOG" 2>/dev/null; then
                echo "[$NAME] ✔ BOOT COMPLETO — coletando +75s de pós-boot"
                sleep 75; DONE=1; break
              fi
              if ! kill -0 $Q 2>/dev/null; then
                echo "[$NAME] ✖ QEMU saiu (kernel panic/reboot?)"; break
              fi
              if [ $((i % 6)) -eq 0 ]; then
                echo "[$NAME] t=$((i*5))s log=$(stat -c%s "$LOG" 2>/dev/null || echo 0) bytes"
              fi
              sleep 5
            done
            kill $Q 2>/dev/null; wait $Q 2>/dev/null
            echo "== [$NAME] veredito: $(grep -c 'Startup finished' "$LOG" 2>/dev/null) marcador(es) de boot completo =="
            echo "== [$NAME] últimas 80 linhas do serial =="
            tail -80 "$LOG"
            # progresso das unidades systemd (p/ ver o que subiu/parou)
            echo "== [$NAME] unidades systemd citadas =="
            grep -E 'systemd\[1\]: (Starting|Started|Failed|Reached|Job)' "$LOG" | tail -60 || true
          }

          # 1) Entrada DEFAULT da Elite: kernel BORE (o que o usuário bootou 1º)
          boot_test bore vmlinuz-linux-cachyos-bore initramfs-linux-cachyos-bore.img ""

          # 2) Entrada NVIDIA (stock kernel — o que o usuário tentou depois)
          boot_test stocknv vmlinuz-linux initramfs-linux-nvidia.img \
            "nvidia nvidia-drm.modeset=1 nouveau.modeset=0 module_blacklist=nouveau radeon.modeset=1 i915.modeset=1"

      - name: Upload dos logs seriais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-boot-logs
          path: |
            serial-*.log
            check.txt
          if-no-files-found: warn
          retention-days: 7
