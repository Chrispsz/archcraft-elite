name: Test Suite

# O quebra-cabeça em cadeia: FASE 1 A MESA → 2 QUALIDADE → 3 UNIDADE →
# 4 CADEIA (overlay + split→hash→reassemble + firstboot dry-run) →
# 5 USO/RELEASE → VEREDICTO. Fase que quebra bloqueia as seguintes;
# GO exige todas as peças encaixadas.
on:
  workflow_dispatch:
  push:
    # v2.1 — a suíte rápida (~1.4 min) roda em TODA branch: push de
    # branch = contratos; só TAG constrói ISO (build.yml). Cada push é
    # auditado pelo que custa segundos, não por uma ISO de 40 min.
    # v2.10.5 — TAG TAMBÉM AUDITA: push de tag v* roda a suíte no commit
    # apontado (a auditoria provou que tag nunca tocava a suíte — a lei
    # 'só publica com suíte verde' agora tem DUAS provas: esta E o job
    # suite do build.yml, que é GATE needs do release).
    branches: ['**']
    tags: ['v*']
    paths:
      - 'elite/**'
      - 'scripts/**'
      - '.ci/**'
      - 'tests/**'
      - 'docs/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'elite/**'
      - 'scripts/**'
      - '.ci/**'
      - 'tests/**'
      - 'docs/**'
      - '.github/workflows/**'

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# v2.10.6 — menor privilégio (a lei do build.yml: a suíte lê, nunca
# escreve): o default GITHUB_TOKEN com write-all era excesso (achado D3).
permissions:
  contents: read

jobs:
  puzzle:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Preparar container (mesa, ferramentas)
        run: |
          pacman-key --init
          # E101.1 — O -Sy SEM -u MATOU A #266/#267: o rsync 3.5.2-3 do db
          # linka libcrypto.so.4; a imagem (snapshot diário) ainda tinha a
          # libcrypto.so.3 — o binário novo nasceu sobre a lib velha e o
          # overlay morreu com 'error while loading shared libraries'
          # (900 peças em cascata, o réu invisível até o stderr viajar
          # inteiro). Arch é rolling INTEIRO: -Syu ou nada.
          pacman -Syu --noconfirm --needed git rsync shellcheck python-yaml python-pillow shfmt bun
      - uses: actions/checkout@v5
      # v2.10.26/E39 — GIT VIVO NO PASSO DA SUÍTE: o set-safe-directory do
      # checkout é config GLOBAL TEMPORÁRIA (env GIT_CONFIG_GLOBAL do passo
      # dele — morre junto). No passo seguinte o git do container volta a
      # RECUSAR o repo (dubious ownership) e `git ls-files -s` sai VAZIO —
      # os guards index-driven (E35.1 e E39) liam o index de mentira: no CI
      # sempre caíram no fallback do filesystem (prova: a peça do incidente
      # 716ee1e reclamou 'sem bit de execução' — frase do ramo FALLBACK, não
      # do ramo do index). A peça nova do E39 sem fallback expôs a ficção
      # (4 falhas com mode vazio no run 41643776977). Aqui o safe.directory
      # é escrito no config PERMANENTE do container — o passo da suíte lê o
      # index de verdade, que é o que o checkout e o squashfs herdam.
      - name: git confia no workspace (o safe.directory do checkout é temporário)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Montar o quebra-cabeça (5 fases + veredito)
        run: bash tests/run-tests.sh
      - name: shfmt (informativo — não bloqueia)
        run: shfmt -d scripts/*.sh .ci/*.sh elite/fragments/*.sh || true
