name: Build Elite ISO

on:
  workflow_dispatch:
  push:
    # v2.1 — REORG: ISO só nasce de TAG (evento de release) ou de dispatch
    # manual. Push de branch roda a suíte de contratos (tests.yml, ~2 min)
    # — não mais uma ISO inteira idêntica: a ['**'] antiga construía ISO
    # até para push de docs (as runs #68-#71 em sequência são o flagrante).
    # O paths-ignore mantém docs/testes fora do runner nas tags.
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', 'tests/**']

# v2.1 — menor privilégio: o workflow inteiro só lê; ÚNICO job com
# escrita é o release (publica a release). O job de relay automático foi REMOVIDO
# do pipeline: dispatchava deepseek+mimo EM TODA build — inclusive em
# runs canceladas (a #91 cancelada queimou 2 dispatches) — até esgotar
# a cota free do Token Harbor (HTTP 429 em massa). Auditoria de IA agora
# é sob demanda: agents.yml manual, protocolo em docs/AGENTS.md.
permissions:
  contents: read

concurrency:
  group: build-elite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Qualidade: shellcheck como gate + shfmt informativo ──────────
  lint:
    # FIXO em 24.04: o label ubuntu-latest migrou p/ Ubuntu 26 em out/2026 —
    # runner image é superfície de risco p/ o build privilegiado (docker run
    # --privileged); pin = build reproduzível, migração avaliada com calma.
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Preparar container
        # E101.1 — O -Sy VIRou -Syu (a run #267 flagrou): o rsync 3.5.2-3 do
        # db linka libcrypto.so.4 e o -Sy sem -u instalava o binário NOVO
        # sobre a lib VELHA da imagem (partial upgrade = Frankenstein —
        # 'error while loading shared libraries'). Container Arch se
        # atualiza INTEIRO ou não se atualiza.
        run: pacman -Syu --noconfirm --needed git shellcheck shfmt
      # v5 = Node 24 nativo (v4 alvo Node 20: warning de deprecação em todo run)
      - uses: actions/checkout@v5
        # v2.10.6 — o token NÃO dorme no .git/config: o checkout entra num
        # container --privileged (pacstrap monta /proc) — credencial
        # persistida lá era vetor (achado D2 da Rodada 2). O persist-
        # credentials é INPUT do checkout (with:); solto no step é
        # 'unexpected key' e o GitHub reprova o workflow inteiro (a run
        # #123 pegou a classe — schema do Actions só o GitHub valida).
        with:
          persist-credentials: false
      - name: shellcheck (gate — warning ou acima; infos são intencionais e documentadas)
        run: |
          shopt -s globstar
          # v2.0.1 — run #88 em flagrante: o glob craft-* pegou o
          # craft-dock-gui, que é PYTHON (#!/usr/bin/python3) — shellcheck
          # só aceita sh/bash/dash/ksh (SC1071 = erro). O gate varre a
          # lista e PULA qualquer shebang python: novos scripts Python no
          # bin/ não quebram o lint, e nada sai da cobertura shell.
          rc=0
          # v2.3.1 — a lista é ENUMERADA DO DISCO (não hardcoded): o
          # 'fg-booster' fixo aqui derrubou as builds #95 E #96 inteiras
          # (o binário foi deletado na v2.2 — a lista continuou cobrando;
          # 'head: cannot open ... fg-booster' = lint vermelho antes do
          # build nem começar). Elite-tune + craft-* + autostart cobrem os
          # shell; os python (craft-dock-gui) são pulados pelo shebang.
          for f in scripts/*.sh .ci/*.sh elite/fragments/*.sh \
                   elite/airootfs/usr/local/bin/elite-tune \
                   elite/airootfs/usr/local/bin/elite-status \
                   elite/airootfs/usr/local/bin/craft-* \
                   elite/airootfs/etc/skel/.config/labwc/autostart; do
            head -n1 "$f" | grep -q '^#!.*python' && continue
            shellcheck -S warning -x "$f" || rc=1
          done
          exit $rc
      - name: shfmt (informativo — não bloqueia)
        run: shfmt -d scripts/*.sh .ci/*.sh elite/fragments/*.sh || true

  # ── v2.10.5 — SUÍTE COMO GATE DE RELEASE ────────────────────────
  # A auditoria de simulações provou: push de TAG não disparava a suíte
  # (tests.yml só ouvia branch) — a lei 'só publica com suíte verde' não
  # tinha dentes na linha do release. Agora tem: o release exige ESTE job
  # (needs), que roda o quebra-cabeça inteiro no commit da tag.
  suite:
    name: Suíte de contratos (gate de release)
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 15
    steps:
      - name: Preparar container (mesa, ferramentas)
        run: |
          pacman-key --init
          # E101.1 — -Syu: partial upgrade é Frankenstein (o rsync da #267
          # nasceu sem a libcrypto dele — container se atualiza INTEIRO)
          pacman -Syu --noconfirm --needed git rsync shellcheck python-yaml python-pillow shfmt bun
      - uses: actions/checkout@v5
        # v2.10.6 — o token NÃO dorme no .git/config: o checkout entra num
        # container --privileged (pacstrap monta /proc) — credencial
        # persistida lá era vetor (achado D2 da Rodada 2). O persist-
        # credentials é INPUT do checkout (with:); solto no step é
        # 'unexpected key' e o GitHub reprova o workflow inteiro (a run
        # #123 pegou a classe — schema do Actions só o GitHub valida).
        with:
          persist-credentials: false
      # v2.10.27 — A SEGUNDA PORTA (o run 41694485151 morreu AQUI): este job
      # roda a MESMA suíte do tests.yml e herdava o MESMO git desconfiado —
      # o set-safe-directory do checkout@v5 é config global TEMPORÁRIA (morre
      # com o passo dele); no passo da suíte o git do container RECUSA o repo
      # (dubious ownership), `git ls-files -s` sai VAZIO e o guard
      # index-driven do E39 — sem fallback desde a v2.10.26 — tombou com mode
      # vazio nas MESMAS 4 peças do run 41643776977. A cura E39 foi só ao
      # tests.yml; o portão do build ficou doente. Cura idêntica, escrita no
      # config PERMANENTE do container ANTES da suíte.
      - name: git confia no workspace (a cura E39 chega à segunda porta)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Montar o quebra-cabeça (5 fases + veredito)
        run: bash tests/run-tests.sh

  # ── Build da ISO (container Arch PRIVILEGIADO via docker run) ────
  # jobs.container: não tem permissão de mount (pacstrap monta /proc
  # no chroot) — por isso o docker run --privileged a partir do runner.
  build:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        # v2.10.6 — o token NÃO dorme no .git/config: o checkout entra num
        # container --privileged (pacstrap monta /proc) — credencial
        # persistida lá era vetor (achado D2 da Rodada 2). O persist-
        # credentials é INPUT do checkout (with:); solto no step é
        # 'unexpected key' e o GitHub reprova o workflow inteiro (a run
        # #123 pegou a classe — schema do Actions só o GitHub valida).
        with:
          persist-credentials: false

      - name: Restaurar cache de pacotes (pacman + [elite-local])
        # v2.1 — os ~2 GB de pacotes baixados a cada run (preparo do
        # container + preflight, ~8 min medidos) agora persistem. Chave =
        # hash da lista de pacotes: mudou a lista, cache novo (com
        # restore-keys para aproveitar o que servir). Os .db NUNCA são
        # cacheados (lição #17: db velho = mirror skew) — o preflight
        # re-sincroniza os dbs a cada run como sempre fez.
        uses: actions/cache@v4
        with:
          path: .ci-cache
          key: elite-pkgs-v1-${{ hashFiles('elite/packages.add', 'elite/packages.remove', 'elite/pacman-repos.build.add', '.ci/build.sh') }}
          # E32: '.ci/build.sh' na chave — o bump do Brave (pin novo no
          # PKGBUILD heredoc) TEM de invalidar o cache, senão o cache-hit
          # devolve o pkg da versão VELHA para sempre (a chave velha só
          # via as listas de pacotes, que não mudam no bump).
          restore-keys: |
            elite-pkgs-v1-

      - name: Construir ISO (container Arch privilegiado)
        # v1.5.2: o log da build é EVIDÊNCIA — capturado (tee) e auditado
        # (log-forensics.sh) no passo seguinte. pipefail: quem quebra a
        # pipe é o docker, não o tee. Forense validada contra a história:
        # o log da v1.4 (verde, releaseada) tem 5 classes fatais literais
        # — este gate as teria barrado ANTES do burn test do dono.
        # v2.1: .ci-cache/{pacman,elite-local} montados no container —
        # cache quente = −6 a −12 min por build.
        run: |
          set -o pipefail
          mkdir -p .ci-cache/pacman .ci-cache/elite-local
          chmod 777 .ci-cache/pacman .ci-cache/elite-local
          # E32 — marker da versão da casa (craft-update compara com a
          # release viva): a tag corrente entra no build de primeira mão.
          # LIÇÃO DA RUN 41254337648: comentário NUNCA dentro das
          # continuações '\' do comando — a linha '#' quebra a cadeia e o
          # docker perde o argumento da imagem ('requires at least 1
          # argument' antes de qualquer byte da ISO).
          docker run --rm --privileged \
            -v "$PWD":/work \
            -v "$PWD/.ci-cache/pacman":/var/cache/pacman/pkg \
            -v "$PWD/.ci-cache/elite-local":/var/cache/elite-local \
            -v /mnt:/mnt \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -e ELITE_VERSION="${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}" \
            -w /work \
            archlinux:base-devel \
            bash .ci/build.sh 2>&1 | tee build-output.log

      - name: Forense do log de build (v1.5.2 — erro silencioso = run vermelha)
        # Diretriz do dono pós-v1.5: "esses erros não podem passar ou ser
        # tratados como algo normal". A v1.4 saiu sem cachyos-keyring com
        # os erros ESCRITOS no log e ninguém varreu. Este gate transforma
        # padrão fatal conhecido em falha alta — ANTES do release.
        run: bash scripts/log-forensics.sh build-output.log

      - name: Upload artefato (ISO inteira, sempre)
        uses: actions/upload-artifact@v4
        with:
          name: archcraft-elite-iso
          path: out/*
          retention-days: 30
          compression-level: 0

      # ── E32 — O REPO DA CASA [elite-local] ──────────────────────────
      # "Deixe tudo atualizável": os pkgs da casa (brave-origin, pwvucontrol,
      # craft-toplevel, wlrctl + keyring/mirrorlist) viajam como artifact
      # até o release job, que os publica como ASSETS da release viva — a
      # URL 'releases/latest/download' do [elite-local] no pacman.conf
      # (E32) resolve para cá. O selo sha256 segue no artifact e é
      # re-verificado no release job ANTES de qualquer upload.
      - name: Selo dos pacotes [elite-local] (sha256 viajando com eles)
        run: |
          cd .ci-cache/elite-local
          ls -lh
          sha256sum *.pkg.tar.zst > sha256sums.txt
          cat sha256sums.txt

      - name: Upload pacotes [elite-local] (fonte do repo da casa)
        uses: actions/upload-artifact@v4
        with:
          name: elite-local-pkgs
          path: .ci-cache/elite-local/*
          retention-days: 7
          compression-level: 0

  # ── Gate de instalação (v1.0.5): o disco INSTALADO tem que bootar ──────
  # Reusa o verify-install.yml (workflow_call) — a cadeia Calamares fiel
  # (unpackfs rsync→btrfs + E5a + E10 cp + initcpio@elite + GRUB) e o boot
  # do disco instalado no QEMU. O verify acima só prova o LIVE; o bug do
  # rig B (vmlinuz truncado em btrfs → 'premature end of file' no GRUB)
  # era invisível para ele. Release sem install-boot verde = gambiarra.
  # (v1.5.2: diag-install.yml renomeado p/ verify-install.yml — nomenclatura
  # de debug não vive em pipeline de produção; mesmo conteúdo, novo nome.)
  verify-install:
    needs: build
    uses: ./.github/workflows/verify-install.yml
    with:
      # FIX #52 (forense: builds #48–#52): a ISO que este gate testa é a
      # DESTA run — o artifact sobe no job build acima. Sem o input, o
      # verify-install (ex-diag-install) caía no fallback "última bem-sucedida" (ISO v1.0.4
      # da run #45) e reprovava eternamente o linux.preset legítimo
      # daquela era — 5 builds reprovadas por um gate cego. O input
      # explícito é a fonte da verdade: GITHUB_EVENT_NAME (env) nunca
      # vale 'workflow_call' — o env reflete o evento da run (push/
      # dispatch/tag), não o tipo de chamada do workflow.
      run_id: ${{ github.run_id }}
    permissions:
      contents: read
      actions: read

  # ── Release: SÓ depois dos gates (live-boot verify + install-boot) ──
  # v1.8.1 — A CLASSE "RELEASE TRUNCADA" MORTA POR CONTRATO: a v1.8.0
  # subiu TRUNCADA (1.55 GiB de 2.77 GiB — blob flaky no download do
  # artifact no release job da #82) e ninguém viu: o split <2 GiB celebrou
  # o truncamento como "compressão zstd nova" e o Ventoy do dono recusou
  # a ISO (PVD declarava 2,77 GiB). Três barreiras agora:
  #   GATE 1 (pré-upload): o artifact tem de casar com o sha256sums.txt
  #     que o build.sh sela DENTRO dele — download de artifact corrompido
  #     = run vermelha ANTES de qualquer upload.
  #   GATE 2 (pós-upload): re-download do ASSET publicado + sha256sum -c —
  #     o blob do GitHub é a única verdade do dono; mismatch = run vermelha
  #     (e sem asset quebrado no ar: a release já nasceu verificada).
  #   EVIDÊNCIA no corpo: tabela sha256 + tamanhos visíveis na release.
  release:
    needs: [build, verify, verify-install, suite]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # v2.1 — único job com escrita no workflow (menor privilégio)
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Baixar artefato da ISO (desta build)
        uses: actions/download-artifact@v4
        with:
          name: archcraft-elite-iso
          path: out

      # E32 — os pkgs da casa chegam junto (fonte do [elite-local])
      - name: Baixar pacotes [elite-local] (desta build)
        uses: actions/download-artifact@v4
        with:
          name: elite-local-pkgs
          path: elite-repo

      - name: GATE 1 — integridade do artifact (sha256sums selado pelo build.sh)
        run: |
          cd out
          ls -lh --si
          echo "── GATE 1: artifact vs sha256sums.txt (iso + sumas na MESMA caixa)"
          sha256sum -c sha256sums.txt

      # ── Release: asset único ≤ 2 GiB; senão, partes de 1.9 GB ─────
      - name: Preparar assets de release (split se > 2 GiB)
        run: |
          cd out
          ISO=$(ls *.iso)
          SZ=$(stat -c%s "$ISO")
          LIMIT=2147483648
          if [ "$SZ" -le "$LIMIT" ]; then
            echo "ISO única ($SZ bytes ≤ 2GiB) — asset único."
          else
            echo "ISO $SZ bytes > 2GiB — dividindo em partes de 1.9GB."
            split -b 1900M -d "$ISO" "${ISO}.part-"
            rm -f "$ISO"
            printf '%s\n' \
              "# ISO dividida (limite de 2 GiB por arquivo do GitHub)" \
              "" \
              "Baixe **todas** as partes \`${ISO}.part-*\` na mesma pasta e junte:" \
              "" \
              "    cat ${ISO}.part-* > ${ISO}" \
              "" \
              "Confira a integridade: \`sha256sum -c <(grep -E 'part|${ISO}$' sha256sums.txt)\`" \
              "(sha256sums.txt traz a ISO inteira E as partes)." \
              > JUNTAR-ISO.md
            sha256sum -- "${ISO}.part-"* >> sha256sums.txt
            ls -lh --si
          fi

      # Corpo da release: a tabela de integridade VISÍVEL (na v1.8.0 o
      # PVD dizia 2,77 GiB e o asset tinha 1,55 — na tabela isso salta
      # aos olhos antes de qualquer download).
      - name: Corpo da release (tabela de integridade)
        run: |
          cd out
          {
            echo "### Integridade (verificada no upload — confira após baixar)"
            echo ""
            echo '```'
            cat sha256sums.txt
            echo '```'
            echo ""
            if ls *.part-* >/dev/null 2>&1; then
              echo "**ISO dividida** (> 2 GiB): baixe **todas** as \`.part-*\` na mesma pasta e junte com \`cat <ISO>.part-* > <ISO>\` — passo a passo em \`JUNTAR-ISO.md\`."
            else
              echo "**ISO única** (≤ 2 GiB) — direto no Ventoy/Rufus."
            fi
            echo ""
            echo "**Atualização pelo terminal** (E32/E43): os pacotes da casa (\`brave-origin\`, \`pwvucontrol\`, \`craft-toplevel\`, \`elite-craft\`, \`wlrctl\`) acompanham esta release como assets — são o repo \`[elite-local]\` que o \`pacman.conf\` da ISO consome; \`craft-update\` (= \`sudo pacman -Syu\`) atualiza TUDO, navegador incluso. A partir da E43, os COMMITS de código de casa chegam como atualização ENTRE releases (canal diário — sem formatar nem reinstalar)."
          } > body.md

      - name: Release (push de tag v*)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*
          body_path: out/body.md
          generate_release_notes: true

      # ── E32 — O REPO DA CASA VIRA ASSET DA RELEASE VIVA ─────────────
      # Publicada a release, os pkgs verificados sobem como assets e a URL
      # 'releases/latest/download/<arquivo>' do [elite-local] passa a
      # resolver para CÁ. O db é REGERADO aqui (repo-add): o selo cobre os
      # pkgs; o db é derivado deles nesta mesma step (nada de selo velho).
      - name: Repo [elite-local] → assets da release (pacman -Syu atualiza a casa)
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          cd elite-repo
          echo "── GATE R: integridade dos pkgs da casa (selo do job build)"
          sha256sum -c sha256sums.txt
          echo "── gerando o db (repo-add num container Arch efêmero)"
          # o repo-add cria elite-local.db como SYMLINK — rm antes do cp
          # (lição da run 41254942475: cp contra o próprio symlink = erro)
          docker run --rm -v "$PWD":/repo -w /repo archlinux:base-devel \
            bash -c 'repo-add --quiet elite-local.db.tar.gz *.pkg.tar.zst && rm -f elite-local.db && cp elite-local.db.tar.gz elite-local.db'
          ls -lh
          echo "── subindo como assets de $TAG"
          # E43 — A DIETA DOS ASSETS (o dono: 'porque está saindo tantos assets?'):
          # os pacotes -debug NÃO sobem mais (símbolos de desenvolvedor não são
          # produto; craft-toplevel/elite-craft nem os produzem mais — options=
          # (!debug) no template; pwvucontrol/wlrctl (AUR) são filtrados aqui).
          # O selo sha256sums-pacotes.txt cobre EXATAMENTE o que sobe.
          PKGS=$(ls *.pkg.tar.zst | grep -v -- '-debug-')
          echo "$PKGS"
          sha256sum $PKGS > sha256sums-pacotes.txt
          gh release upload "$TAG" elite-local.db elite-local.db.tar.gz $PKGS sha256sums-pacotes.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "── assets pós-upload:"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'

      - name: GATE 2 — verificação PÓS-upload (re-download do que o GitHub guardou)
        run: |
          cd out
          TAG="${GITHUB_REF#refs/tags/}"
          echo "── GATE 2: re-baixando os assets de '$TAG' — o blob do GitHub tem de ser a ISO selada"
          rm -f body.md JUNTAR-ISO.md
          mkdir downloaded
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir downloaded --clobber
          cd downloaded
          ls -lh --si
          # a ISO inteira (nome original) só existe como asset no modo
          # single; no split ela é reconstruída das partes --ignore-missing
          # verifica O QUE EXISTE: qualquer byte divergente = run vermelha
          sha256sum -c ../sha256sums.txt --ignore-missing

      # ── E31 (v2.10.19) — LEI DA RELEASE ÚNICA VIVA, AGORA COM DENTES ──
      # Publicada a release da tag corrente, TODA outra release sai do ar
      # (em qualquer momento só UMA vive) — as TAGS ficam (lei: tag nunca
      # se apaga, --cleanup-tag=false). Antes disto a lei dependia do
      # agente executá-la à mão após o verde; a CI mesma cumpre agora —
      # vale para a build mensal automática (a máquina não esquece).
      - name: Lei da Release Única Viva — só UMA release no ar (tags preservadas)
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "── releases vivas antes da lei:"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | "\(.id) \(.tag_name)"' || true
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' \
            | grep -vxF "$TAG" \
            | while read -r OLD; do
                [ -n "$OLD" ] || continue
                echo "── lei: apagando release '$OLD' (tag PRESERVADA)"
                if gh release delete "$OLD" --repo "$GITHUB_REPOSITORY" --cleanup-tag=false --yes; then
                  echo "   OK: release $OLD apagada"
                else
                  echo "   FALHOU apagar $OLD — o agente no campo resolve (a tag e a release atual seguem íntegras)"
                fi
              done
          echo "── releases vivas depois da lei (deve sobrar só $TAG):"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | "\(.id) \(.tag_name)"' || true

  # ── Verificação pós-build: a ISO recém-nascida BOOTA? (gate QEMU) ─
  # Diretriz do dono do projeto: "você testando, você dando o boot" —
  # toda build passa pelo boot serial no QEMU ANTES de ser considerada
  # boa. GATE duro: Startup finished + sem shell de emergência + sem
  # 203/EXEC (binários executáveis no squashfs).
  verify:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Instalar QEMU + 7zip
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 p7zip-full >/dev/null
          qemu-system-x86_64 --version | head -1

      - name: Baixar artefato da ISO (desta build)
        uses: actions/download-artifact@v4
        with:
          name: archcraft-elite-iso
          path: iso-out

      - name: Extrair kernel/initrd + UUID do marcador
        run: |
          cd iso-out
          ISO=$(ls *.iso)
          echo "ISO=$ISO" >> "$GITHUB_ENV"
          # v2.1 — GATE DURO: divergiu do sha256 selado = run vermelha.
          # (Antes o || true ENGOLIA a checagem: ISO truncada seguia para
          # boot e podia passar — exatamente a classe v1.8.0.)
          sha256sum -c sha256sums.txt --ignore-missing
          7z x -y "$ISO" -o../extracted/ 'arch/boot/x86_64/vmlinuz-linux-cachyos-bore' 'arch/boot/x86_64/initramfs-linux-cachyos-bore.img' 'boot/syslinux/archiso_sys-linux.cfg' >/dev/null
          cd ../extracted
          ls -la arch/boot/x86_64/
          echo "── entrada default do syslinux (cmdline que o usuário boota):"
          grep -m1 '^APPEND ' boot/syslinux/archiso_sys-linux.cfg || { echo '✖ APPEND ausente'; exit 1; }

      - name: Boot serial no QEMU (kernel BORE, CMDLINE REAL da ISO)
        run: |
          set +e
          # LIÇÃO DA #43: o gate NÃO pode inventar a própria cmdline. A #43
          # falhou porque o -append hardcoded não tinha o fix [6.2]
          # (timeouts 90s) — bootava com os 15s do cachyos-settings e o
          # nsresourced entrava em loop (153 falhas). O usuário real boota
          # pela entrada do syslinux/grub, QUE TEM o fix. Então o gate extrai
          # a cmdline REAL da entrada default (label 'arch', kernel BORE) e
          # só ajusta observabilidade p/ serial: sem quiet/splash, loglevel=7,
          # console=ttyS0 — nada do que é testado muda.
          ENTRY="extracted/boot/syslinux/archiso_sys-linux.cfg"
          APPEND_ISO=$(grep -m1 '^APPEND ' "$ENTRY" | sed 's/^APPEND //')
          if [ -z "$APPEND_ISO" ]; then echo "✖ APPEND não encontrado em $ENTRY"; exit 1; fi
          echo "── cmdline REAL da ISO (default, BORE):"
          echo "   $APPEND_ISO"
          APPEND_GATE=$(printf '%s' "$APPEND_ISO" \
            | sed -e 's/quiet splash //' -e 's/loglevel=[0-9]*/loglevel=7/')
          APPEND_GATE="$APPEND_GATE console=ttyS0,115200 systemd.log_target=console systemd.log_level=info systemd.show_status=yes"
          echo "── cmdline do gate (real + serial):"
          echo "   $APPEND_GATE"
          # v2.10.5 — KVM QUANDO EXISTE: o gate cobrava 'sessão não chegou
          # COM KVM DISPONÍVEL' mas bootava em TCG — a cobrança e a máquina
          # discordavam. Agora o QEMU usa KVM quando o runner tem (e a
          # cobrança fica honesta: mesma moeda dos dois lados).
          KVM=""
          if [ -e /dev/kvm ] && [ -w /dev/kvm ]; then KVM="-enable-kvm"; echo "── KVM disponível: boot acelerado"; fi
          # v2.10.5b — A LIÇÃO DA PRIMEIRA TENTATIVA: '-cpu max' NUNCA sai
          # da linha. O edit do KVM trocou '-machine q35 -cpu max' por
          # '-machine q35 $KVM' e com TCG ($KVM vazio) o QEMU subiu com a
          # CPU default (qemu64) — o kernel BORE (x86-64-v3) morreu no
          # handoff, e com -no-reboot o triple-fault ENCERROU o QEMU em
          # 20s (serial com só SeaBIOS no tail — a prova no log do verify
          # da primeira build v2.10.5). '-cpu max' é válido em TCG E KVM;
          # o $KVM só carrega o -enable-kvm.
          qemu-system-x86_64 \
            -machine q35 -cpu max $KVM -smp 2 -m 7168 \
            -kernel "extracted/arch/boot/x86_64/vmlinuz-linux-cachyos-bore" \
            -initrd "extracted/arch/boot/x86_64/initramfs-linux-cachyos-bore.img" \
            -append "$APPEND_GATE" \
            -cdrom "$PWD/iso-out/$ISO" \
            -nographic -no-reboot -nic user \
            > serial-verify.log 2>&1 &
          Q=$!
          # até ~55 min (TCG é lento; com o fix [6.2] a fase final chega em
          # ~5min local — janela folgada; o loop também sai no emergente)
          for i in $(seq 1 660); do
            grep -q 'Startup finished' serial-verify.log 2>/dev/null && break
            grep -q 'rootfs ~]#' serial-verify.log 2>/dev/null && break
            kill -0 $Q 2>/dev/null || break
            sleep 5
          done
          # v1.7.1 — PROBE DA SESSÃO GRÁFICA: o gate antigo parava no LOGIN
          # e nunca viu a sessão (a classe "barras mortas" atravessou
          # v1.6.2→v1.7.0 invisível). O elite-session-probe.service roda 60s
          # pós-graphical.target e imprime o estado REAL da sessão no console
          # (= serial). Espera o bloco marcado antes de encerrar o QEMU.
          for i in $(seq 1 48); do
            grep -q 'ELITE_PROBE_END' serial-verify.log 2>/dev/null && break
            kill -0 $Q 2>/dev/null || break
            sleep 5
          done
          sleep 15                         # v2.1: flush 5→15s — unidade que falha logo após o probe entra no veredito
          kill $Q 2>/dev/null; wait $Q 2>/dev/null
          echo "════════ ÚLTIMAS 40 LINHAS DO SERIAL ════════"
          tail -40 serial-verify.log

      - name: GATE — veredito do boot
        run: |
          # v1.0.5: set +e — o 'set -e' antigo matava o gate no PRIMEIRO grep
          # sem match, ANTES do chk imprimir o diagnóstico (#42/#43: gate
          # vermelho sem uma única linha de explicação no log). Cada grep
          # alimenta o chk; o exit $FAIL no final decide a run.
          set +e
          FAIL=0
          chk() { # $1=condição(0=ok) $2=mensagem-ok $3=mensagem-fail
            if [ "$1" -eq 0 ]; then echo "✔ $2"; else echo "✖ $3"; FAIL=1; fi
          }
          grep -q 'Startup finished' serial-verify.log
          chk $? "boot COMPLETO (Startup finished)" "boot NÃO completou (sem Startup finished)"
          ! grep -q 'rootfs ~]#' serial-verify.log
          chk $? "sem shell de emergência do initramfs" "initramfs caiu em shell de emergência"
          ! grep -qE 'code=203/EXEC|Unable to locate executable' serial-verify.log
          chk $? "binários Elite executáveis (sem 203/EXEC — fix [9b] verificado)" "203/EXEC no live: binário 0644 no squashfs"
          # regressão do [6.2]: a entrada REAL da ISO TEM que carregar os
          # timeouts 90s — é o que o usuário boota (a #43 falhou o boot
          # exatamente por testar uma cmdline sem o fix)
          grep -q 'systemd.default_timeout_start_sec=90' extracted/boot/syslinux/archiso_sys-linux.cfg
          chk $? "cmdline real da ISO com timeout 90s ([6.2] presente)" "ISO sem timeout 90s no cmdline — fix [6.2] REGREDIU"
          # v1.5.2: NENHUMA unidade pode terminar em failed no live. O
          # fg-booster crash-loopou em TODA boot v1.0→v1.5 (debloat v4.2
          # varreu o xdotool; 17 'Failed with result' no serial completo
          # da v1.5) e 'Startup finished' não enxerga units falhadas.
          # Alguma unidade falha só no QEMU? Então se documenta AQUI, com
          # exceção explícita e prova — nunca silenciosamente (a regra da
          # forense de log vale aqui também: benigno é benigno POR ESCRITO).
          units=$(sed 's/\x1b\[[0-9;]*m//g' serial-verify.log \
            | grep -oE "[a-zA-Z0-9@._-]+\\.service: Failed with result" \
            | sort -u | tr '\n' ' ')
          ! grep -q 'Failed with result' serial-verify.log
          chk $? "nenhuma unidade systemd em failed no live (v1.5.2 — crash-loop caçado)" "unidade(s) em failed: ${units:-?}"
          # v1.7.1 — GATE DA SESSÃO GRÁFICA: o que o dono vê NÃO é o login, é
          # a sessão. Desde a v2.0 a sessão é waybar top + dock NATIVA
          # (craft-dock-gui, GTK) — o "-ge 2" herdado da era waybar-dock era
          # um contrato defasado que a #93 flagrou (1/2 com a dock
          # crash-loopando por pin inexistente: 'brave.desktop' vs o
          # 'brave-browser.desktop' REAL do pacote). Agora: waybar ≥1 E
          # dock ≥1 E zero mortes (BARS_EXITS = 'SAIU exit=' do craft-bars).
          # Se o probe não chegou (QEMU headless sem sessão), informativo — o
          # gate não cobra o que não pode ver (mesma honestidade do bloco acima).
          if grep -q 'ELITE_PROBE_END' serial-verify.log; then
            echo "── bloco do probe da sessão:"
            sed -n '/ELITE_PROBE_BEGIN/,/ELITE_PROBE_END/p' serial-verify.log | sed 's/^/   /'
            WC="$(sed 's/\x1b\[[0-9;]*m//g' serial-verify.log | grep -oE 'WAYBAR_COUNT=[0-9]+' | head -1 | cut -d= -f2)"
            DK="$(sed 's/\x1b\[[0-9;]*m//g' serial-verify.log | grep -oE 'DOCK_COUNT=[0-9]+' | head -1 | cut -d= -f2)"
            TP="$(sed 's/\x1b\[[0-9;]*m//g' serial-verify.log | grep -oE 'TOPLEVEL_COUNT=[0-9]+' | head -1 | cut -d= -f2)"
            TS="$(sed 's/\x1b\[[0-9;]*m//g' serial-verify.log | grep -oE 'TOPLEVEL_SOCKET=[A-Z]+' | head -1 | cut -d= -f2)"
            BE="$(sed 's/\x1b\[[0-9;]*m//g' serial-verify.log | grep -oE 'BARS_EXITS=[0-9]+' | head -1 | cut -d= -f2)"
            [ -n "$WC" ] && [ "$WC" -ge 1 ] 2>/dev/null
            chk $? "sessão gráfica VIVA: waybar top vivo (probe: WAYBAR_COUNT=${WC:-0})" "PROBLEMA REAL DE SESSÃO: waybar top não está vivo (${WC:-0}) — classe 'subiu só o wallpaper' que o dono viu (ver BARS| acima)"
            [ -n "$DK" ] && [ "$DK" -ge 1 ] 2>/dev/null
            chk $? "sessão gráfica VIVA: dock nativa viva (probe: DOCK_COUNT=${DK:-0})" "PROBLEMA REAL DE SESSÃO: dock craft-dock-gui NÃO está viva (${DK:-0}) — pin quebrado/crash (ver BARS| acima; na #93 crash-loopou 15× com 'brave.desktop' inexistente)"
            # v2.10.1 — a dock COMUTADORA: o daemon wlr-foreign-toplevel vivo
            # E falando (PING no socket da sessão — sem isto a dock fica no
            # fallback v2.10: sem ciclo por janela, sem comutador clicável)
            [ -n "$TP" ] && [ "$TP" -ge 1 ] 2>/dev/null
            chk $? "sessão gráfica VIVA: daemon das janelas vivo (probe: TOPLEVEL_COUNT=${TP:-0})" "PROBLEMA REAL DE SESSÃO: craft-toplevel NÃO está vivo (${TP:-0}) — a dock comutadora fica no fallback v2.10 (ver BARS| acima)"
            [ "$TS" = "OK" ] 2>/dev/null
            chk $? "daemon das janelas FALANDO no socket da sessão (probe: TOPLEVEL_SOCKET=${TS:-AUSENTE})" "craft-toplevel vivo mas socket SEM PING (${TS:-AUSENTE}) — a dock comutadora não tem janelas reais (ver BARS| acima)"
            [ -n "$BE" ] && [ "$BE" -eq 0 ] 2>/dev/null
            chk $? "barras sem NENHUMA morte na sessão (BARS_EXITS=${BE:-?})" "barra(s) morreram ${BE:-?}× na sessão — crash/race/pin quebrado (exit code no BARS| acima)"
            # v2.3.1 — MENUS: os 5 dropdowns da família craft-* (Sessão,
            # Rede, Fixar, Idle, Logout) vivem no fuzzel e morriam calados
            # (rig do dono: "os menus morreram"). O probe agora colhe
            # binário + parse real do fuzzel.ini do usuário — config
            # corrompida ou binário ausente = TODOS os menus mortos.
            FB="$(sed 's/\x1b\[[0-9;]*m//g' serial-verify.log | grep -oE 'FUZZEL_BIN=[^ ]+' | head -1 | cut -d= -f2)"
            FI="$(sed 's/\x1b\[[0-9;]*m//g' serial-verify.log | grep -oE 'FUZZEL_INI=[A-Za-z()]+' | head -1 | cut -d= -f2)"
            [ -n "$FB" ] && [ "$FB" != "AUSENTE" ]
            chk $? "menus VIVOS: fuzzel presente na sessão (FUZZEL_BIN=${FB:-?})" "PROBLEMA REAL: fuzzel AUSENTE — os 5 menus da família craft-* morrem calados"
            # vazio = probe não reportou (regressão do probe); BAD* = INI inválido — ambos falham
            if [ -z "$FI" ] || [ "${FI#BAD}" != "$FI" ]; then FI_BAD=1; else FI_BAD=0; fi
            [ "$FI_BAD" -eq 0 ]
            chk $? "menus VIVOS: fuzzel.ini parseia como INI válido (FUZZEL_INI=${FI:-?})" "PROBLEMA REAL: fuzzel.ini INVÁLIDO/ausente no probe (${FI:-?}) — todos os menus morrem antes de desenhar (classe 'os menus morreram')"
          else
            # v2.1 — FIM DO VERDE-FAKE: com KVM disponível (o runner tem,
            # confirmado nos logs), a sessão gráfica TEM que subir e o
            # probe TEM que chegar ao serial. Sem KVM (TCG lento), segue
            # informativo — o gate não cobra o que não consegue ver.
            if [ -e /dev/kvm ]; then
              echo "✖ probe da sessão NÃO chegou COM KVM DISPONÍVEL — sessão gráfica devia ter subido (classe 'subiu só o wallpaper')"
              FAIL=1
            else
              echo "· informativo: probe da sessão NÃO chegou (sem /dev/kvm — TCG) — gate não cobra o que não vê"
            fi
          fi
          # informativos (o gate não cobra o que não vê — headless QEMU
          # nem sempre mostra a sessão gráfica subindo)
          echo "── informativos ──"
          grep -qiE 'labwc' serial-verify.log && echo "· labwc mencionado no log" || echo "· (labwc: sem menção no serial)"
          exit $FAIL

      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-boot-serial
          path: serial-verify.log
          if-no-files-found: warn
          retention-days: 14

  # ── Auditoria de IA (deepseek + mimo): SOB DEMANDA (v2.1) ─────────
  # O relay automático pós-build foi removido: queimava a cota free do
  # Token Harbor em toda build (inclusive cancelada) até o 429 geral.
  # Dispatch manual quando quiser auditar uma run:
  #   dispatch manual (UI ou API) conforme docs/AGENTS.md — contexto ci:<run_id>
  # Protocolo de consenso (3 IAs): docs/AGENTS.md

  # ── E31 (v2.10.19): A FALHA DE TAG NUNCA É SILENCIOSA ──────────────
  # A build mensal automática (cron do agente) conserta; a ISSUE é o
  # sinal durável: o dono (e o agente da próxima sessão) encontram a
  # falha NOMEADA — lista de jobs + link da run — sem depender de
  # ninguém lembrar de olhar a aba Actions. A tag fica PRESERVADA
  # (lei); a correção nasce numa tag NOVA (patch+1), nunca re-aprove.
  notify-failure:
    needs: [lint, suite, build, verify, verify-install, release]
    if: failure() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Abrir issue de diagnóstico
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          RUNURL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          JOBS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
                   --jq '.jobs[] | "\(.name): \(.conclusion)"' | tr '\n' '; ')"
          BODY="$(printf 'Run: %s\n\nJobs: %s\n\nA tag fica PRESERVADA (lei — tag nunca se apaga; a release não nasceu).\nA correção nasce numa tag NOVA (patch+1) — nunca re-aprove a tag.\nLogs completos: aba Actions desta run.' "$RUNURL" "$JOBS")"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues" \
            -f title="[CI] build da tag ${TAG} falhou — run ${GITHUB_RUN_NUMBER}" \
            -f body="$BODY"
          echo "issue aberta para ${TAG}"
