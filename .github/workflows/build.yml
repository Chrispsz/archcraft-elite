name: Build Elite ISO

on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'Notas da build (opcional)'
        required: false
        default: ''
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']

permissions:
  contents: write

concurrency:
  group: build-elite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Qualidade: shellcheck como gate + shfmt informativo ──────────
  lint:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Preparar container
        run: pacman -Sy --noconfirm --needed git shellcheck shfmt
      - uses: actions/checkout@v4
      - name: shellcheck (gate — warning ou acima; infos são intencionais e documentadas)
        run: |
          shopt -s globstar
          shellcheck -S warning -x \
            scripts/*.sh \
            .ci/*.sh \
            elite/fragments/*.sh \
            elite/airootfs/usr/local/bin/elite-tune \
            elite/airootfs/usr/local/bin/fg-booster \
            elite/airootfs/usr/local/bin/elite-status \
            elite/airootfs/usr/local/bin/elite-wallpaper
      - name: shfmt (informativo — não bloqueia)
        run: shfmt -d scripts/*.sh .ci/*.sh elite/fragments/*.sh || true

  # ── Build da ISO (container Arch PRIVILEGIADO via docker run) ────
  # jobs.container: não tem permissão de mount (pacstrap monta /proc
  # no chroot) — por isso o docker run --privileged a partir do runner.
  build:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Construir ISO (container Arch privilegiado)
        run: |
          docker run --rm --privileged \
            -v "$PWD":/work \
            -v /mnt:/mnt \
            -w /work \
            archlinux:base-devel \
            bash .ci/build.sh

      - name: Upload artefato (ISO inteira, sempre)
        uses: actions/upload-artifact@v4
        with:
          name: archcraft-elite-iso
          path: out/*
          retention-days: 30
          compression-level: 0

      # ── Release: asset único ≤ 2 GiB; senão, partes de 1.9 GB ─────
      - name: Preparar assets de release (split se > 2 GiB)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd out
          ISO=$(ls *.iso)
          SZ=$(stat -c%s "$ISO")
          LIMIT=2147483648
          if [ "$SZ" -le "$LIMIT" ]; then
            echo "ISO única ($SZ bytes ≤ 2GiB) — asset único."
          else
            echo "ISO $SZ bytes > 2GiB — dividindo em partes de 1.9GB."
            split -b 1900M -d "$ISO" "${ISO}.part-"
            rm -f "$ISO"
            printf '%s\n' \
              "# ISO dividida (limite de 2 GiB por arquivo do GitHub)" \
              "" \
              "Baixe **todas** as partes \`${ISO}.part-*\` na mesma pasta e junte:" \
              "" \
              "    cat ${ISO}.part-* > ${ISO}" \
              "" \
              "Confira a integridade: \`sha256sum ${ISO}\` (compare com sha256sums.txt)." \
              > JUNTAR-ISO.md
            ls -lh --si
          fi

      - name: Release (push de tag v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*
          generate_release_notes: true
