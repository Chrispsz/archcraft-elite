[package]
name = "elite-daemon"
version = "2.0.0"
edition = "2021"
description = "ELITE · o orquestrador único da sessão 2.0: janelas Wayland nativas, vigília, áudio, MPRIS, jogo e o bus.sock"
license = "GPL-3.0"

[dependencies]
# 2.0 — A FUNDAÇÃO: os contratos tipados, o bus vivo e a persistência
elite-core = { path = "../elite-core" }
# zbus: o cliente D-Bus NATIVO (GameMode, logind, MPRIS, BlueZ) — zero
# subprocesso dbus-send por rodada (o bash pagava um fork a cada chamada).
zbus = { version = "4", features = ["blocking"] }
# regex: a MESMA família ERE do bash (o padrão GAME_PATS traduzido 1:1)
regex = "1"
libc = "0.2"
# 2.0 — o roteador de áudio: o pactl -f json entrega sinks tipados
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 2.0 — o cliente Wayland NATIVO (zwlr-foreign-toplevel v2 +
# ext-idle-notify-v1): o craft-toplevel.c aposenta. O dlopen carrega a
# libwayland-client NA HORA (build sem headers — a lei do degrau:
# compila em qualquer lugar, a sessão de verdade é quem tem a lib).
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["dlopen"] }
# os protocolos: wlr (foreign-toplevel) + ext (idle-notify, staging)
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
