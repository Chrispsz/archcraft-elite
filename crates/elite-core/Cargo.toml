# elite-core — os contratos tipados e o IPC da casa (2.0)
[package]
name = "elite-core"
version = "2.0.0"
edition = "2021"
description = "ELITE · contratos de estado tipados, protocolo IPC do bus.sock e persistência atômica"
license = "GPL-3.0"

[dependencies]
# serde: os contratos tipados cruzam o socket como JSON (legível no papel
# do craft-dump e estável entre versões — novos campos são opcionais).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 1.0-108 — o poll(2) do atendente do bus (a leitura de quadros é EVENTO
# do kernel — o timeout de leitura de era fatiava quadros; ver bus.rs)
libc = "0.2"

[dev-dependencies]
