# craft-dump-rs — a telemetria v2 da casa (2.0)
[package]
name = "craft-dump-rs"
version = "2.0.0"
edition = "2021"
description = "ELITE · telemetria v2: era nativa, serviços, ausência de legado, boot — o papel que se conhece"
license = "GPL-3.0"

[[bin]]
# 2.0 Fase 2 — a telemetria v2 É o craft-dump (o shell v1 aposentou:
# o nome da casa continua o mesmo, o corpo é Rust; o install do molde
# busca ESTE nome no target/release)
name = "craft-dump"
path = "src/main.rs"

[dependencies]
elite-core = { path = "../elite-core" }
# 1.0-103 — O JUIZ EMBUTIDO: o craft-dump julga o XML da sessão DENTRO do
# binário (o par xmllint/python3 de subprocesso morre com a erradicação do
# python — default-features = false: só o núcleo std do juiz, sem gtk)
craft-tools = { path = "../craft-tools", default-features = false }

[dev-dependencies]
